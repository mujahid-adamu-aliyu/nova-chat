<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#fb923c" />
<title>NovaChat — Profile</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23fb923c'/><path d='M16 26 Q24 18 32 22 Q40 26 48 18' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/><path d='M16 32 Q24 24 32 28 Q40 32 48 24' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' opacity='0.7'/><path d='M16 38 Q24 30 32 34 Q40 38 48 30' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' opacity='0.4'/></svg>" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
  /* ---------- Design tokens ---------- */
  :root{
    --bg: #ddeeff;
    --card: #f0f6ff;
    --ink: #0b1b3a;
    --ink-soft:#5b6b8c;
    --muted:#9aa6c2;
    --line:#e3eaf6;
    --surface:#c9dcf6;
    --surface-2:#bcd2f0;
    --surface-border:#a8c2e8;
    --brand:#1d4ed8;
    --brand-2:#3b82f6;
    --brand-glow: rgba(29,78,216,.35);
    --good:#22c55e;
    --warn:#f59e0b;
    --bad:#ef4444;
    --radius:16px;
    --radius-lg:22px;
    --shadow: 0 18px 40px -18px rgba(15,40,90,.25);
    --transition: .25s cubic-bezier(.4,.0,.2,1);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1000px 500px at 80% -10%, #c8dcff 0%, transparent 60%),
      radial-gradient(800px 500px at -10% 100%, #b8d0ff 0%, transparent 55%),
      radial-gradient(600px 400px at 50% 50%, #d8e8ff 0%, transparent 70%),
      #e8f0ff;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- Offline banner ---------- */
  #offlineBanner{
    position:fixed; top:0; left:0; right:0; z-index:80;
    background:var(--bad); color:#fff; text-align:center;
    padding:10px 14px; font-size:14px; font-weight:600;
    transform:translateY(-100%); transition: transform .35s ease;
  }
  #offlineBanner.show{transform:translateY(0);}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; top: -120px; left:50%; transform: translateX(-50%);
    background:var(--ink); color:#fff;
    padding:12px 18px 12px 14px; border-radius:14px;
    font-size:14px; font-weight:600;
    box-shadow:0 18px 40px -12px rgba(0,0,0,.35);
    transition: top .35s cubic-bezier(.34,1.4,.64,1);
    z-index:9000; max-width: 90%;
    display: flex; align-items: center; gap: 8px;
  }
  .toast.show{ top: calc(18px + env(safe-area-inset-top, 0px));}
  .toast.bad{ background:var(--bad);}
  .toast.good{ background:var(--good);}
  .toast-icon { font-size: 18px; flex-shrink: 0; }

  /* ---------- Button shake ---------- */
  @keyframes btnShake {
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-6px); }
    40%{ transform: translateX(6px); }
    60%{ transform: translateX(-4px); }
    80%{ transform: translateX(4px); }
  }

  /* ============================================================
     PROFILE PAGE STYLES
     ============================================================ */

  /* --- Profile page shell --- */
  #page-profile {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    background:
      radial-gradient(1000px 500px at 80% -10%, #c8dcff 0%, transparent 60%),
      radial-gradient(800px 500px at -10% 100%, #b8d0ff 0%, transparent 55%),
      radial-gradient(600px 400px at 50% 50%, #d8e8ff 0%, transparent 70%),
      #e8f0ff;
    overflow: hidden;
    display: flex; flex-direction: column; padding: 0;
  }

  /* prof-body hidden — hero fills full page */
  #page-profile .prof-body {
    display: none;
  }

  /* --- Top bar: floating island --- */
  .prof-topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    background: rgba(255, 255, 255, 0.55);
    -webkit-backdrop-filter: blur(28px) saturate(200%);
    backdrop-filter: blur(28px) saturate(200%);
    border: 1.5px solid rgba(255,255,255,0.80);
    box-shadow:
      0 8px 32px -8px rgba(29,78,216,.18),
      0 2px 12px -2px rgba(29,78,216,.10),
      0 0 0 1px rgba(255,255,255,.6) inset;
    padding: 8px 10px 8px 8px;
    border-radius: 28px;
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: 16px; right: 16px;
    max-width: 440px; margin: 0 auto;
    z-index: 220;
  }
  .prof-topbar-center {
    font-size: 17px; font-weight: 800; color: var(--ink); letter-spacing: -.2px;
  }
  .prof-topbar-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(29,78,216,.10); color: var(--brand); font-size: 19px;
    transition: background var(--transition);
    -webkit-tap-highlight-color: transparent;
  }
  .prof-topbar-btn:active { background: rgba(29,78,216,.20); }
  #profSaveBtn {
    display: none; height: 34px; padding: 0 16px;
    border-radius: 999px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #1d4ed8, #3b82f6);
    color: #fff; font-size: 14px; font-weight: 700;
    font-family: inherit; transition: transform .15s, opacity .2s;
    box-shadow: 0 6px 18px -4px rgba(59,130,246,.55);
    -webkit-tap-highlight-color: transparent;
  }
  #profSaveBtn:active { transform: scale(.96); }
  #profSaveBtn .save-dots { display: none; gap: 4px; align-items: center; }
  #profSaveBtn .save-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: #fff;
    animation: pulse 1s infinite ease-in-out;
  }
  #profSaveBtn .save-dots span:nth-child(2) { animation-delay: .18s; }
  #profSaveBtn .save-dots span:nth-child(3) { animation-delay: .36s; }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.25);}
  }

  /* --- Hero section — fills full page below topbar --- */
  .prof-hero {
    background: transparent;
    border: none;
    border-radius: 0;
    margin: 0;
    margin-top: calc(72px + env(safe-area-inset-top, 0px));
    margin-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
    padding: 32px 22px 20px;
    text-align: center;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0; transform: translateY(16px);
    animation: profCardIn 300ms cubic-bezier(.4,0,.2,1) forwards;
    animation-delay: 60ms;
  }
  @keyframes profCardIn {
    to { opacity: 1; transform: translateY(0); }
  }
  .prof-avatar-wrap {
    position: relative; width: 80px; height: 80px; margin: 0 auto 14px;
  }
  .prof-avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg, #3b6be8, #6ba3ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800; color: #fff;
    border: 3px solid rgba(255,255,255,.4);
    overflow: hidden; position: relative;
  }
  .prof-avatar img {
    width: 100%; height: 100%; object-fit: cover;
    transition: opacity 300ms ease, transform 300ms ease;
  }
  .prof-avatar-initials { user-select: none; }
  .prof-online-dot {
    position: absolute; top: 2px; right: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--good); border: 2.5px solid white;
    transition: opacity 300ms ease;
  }
  .prof-online-dot.hidden { opacity: 0; }
  .prof-cam-btn {
    position: absolute; bottom: 0; right: 0;
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid white;
    background: var(--brand); color: #fff; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    font-size: 14px; -webkit-tap-highlight-color: transparent;
  }
  .prof-cam-btn.visible { display: flex; }
  .prof-upload-ring {
    position: absolute; inset: -4px; display: none;
    pointer-events: none;
  }
  .prof-upload-ring.visible { display: block; }
  .prof-upload-ring circle {
    fill: none; stroke: #fff; stroke-width: 3;
    stroke-dasharray: 283; stroke-dashoffset: 283;
    transform-origin: center; transform: rotate(-90deg);
    transition: stroke 300ms ease;
  }
  .prof-hero-name {
    font-size: 19px; font-weight: 800; color: var(--ink); margin: 0 0 4px;
  }
  .prof-hero-handle {
    font-size: 13px; color: var(--ink-soft); margin: 0 0 14px;
  }
  .prof-hero-handle.no-handle { font-style: italic; color: var(--brand); text-decoration: underline dotted; cursor: pointer; }

  /* Verified badge */
  .prof-verified-badge {
    display: none;
    align-items: center; justify-content: center;
    color: #60d9fa;
    font-size: 18px;
    filter: drop-shadow(0 1px 4px rgba(96,217,250,.5));
    animation: badgePop .4s cubic-bezier(.4,0,.2,1);
  }
  .prof-verified-badge.show { display: flex; }
  @keyframes badgePop {
    0%   { transform: scale(0); opacity: 0; }
    70%  { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Completion bar */
  .prof-completion-track {
    height: 9px; background: #d1d9ee;
    border-radius: 9px; overflow: hidden; margin: 0 0 6px;
  }
  .prof-completion-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #1d4ed8, #2563eb);
    border-radius: 9px;
    transition: width 600ms cubic-bezier(.4,0,.2,1);
  }
  .prof-completion-label {
    font-size: 12px; color: var(--ink-soft); text-align: left; font-weight: 600;
  }

  /* --- Section cards --- */
  .prof-section {
    margin: 12px 16px 0;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: 0 6px 22px -10px rgba(15,40,90,.18);
    overflow: hidden;
    opacity: 0; transform: translateY(16px);
    animation: profCardIn 300ms cubic-bezier(.4,0,.2,1) forwards;
    border: 1px solid var(--surface-border);
  }
  .prof-section:nth-child(1) { animation-delay: 60ms; }
  .prof-section:nth-child(2) { animation-delay: 120ms; }
  .prof-section:nth-child(3) { animation-delay: 180ms; }
  .prof-section:nth-child(4) { animation-delay: 240ms; }
  .prof-section:nth-child(5) { animation-delay: 300ms; }
  .prof-section:nth-child(6) { animation-delay: 360ms; }

  .prof-section-label {
    padding: 12px 16px 4px;
    font-size: 11px; font-weight: 700; letter-spacing: .6px;
    text-transform: uppercase; color: var(--brand);
  }

  /* --- Info rows --- */
  .prof-row {
    display: flex; align-items: center;
    padding: 14px 16px; gap: 12px; cursor: pointer;
    transition: background .15s; position: relative;
  }
  .prof-row:active { background: #f5f8ff; }
  .prof-row + .prof-row { border-top: 1px solid var(--line); }
  .prof-row-ico {
    width: 36px; height: 36px; border-radius: 10px;
    background: #eef3ff; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--brand); flex-shrink: 0;
  }
  .prof-row-body { flex: 1; min-width: 0; }
  .prof-row-label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .prof-row-value {
    font-size: 15px; color: var(--ink); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .prof-row-value.muted { color: var(--muted); font-weight: 400; font-style: italic; }
  .prof-row-chevron { color: var(--muted); font-size: 18px; flex-shrink: 0; }

  .prof-row-expand {
    max-height: 0; overflow: hidden;
    transition: max-height 300ms cubic-bezier(.4,0,.2,1), opacity 300ms ease;
    opacity: 0; padding: 0 16px;
  }
  .prof-row-expand.open {
    max-height: 140px; opacity: 1; padding: 0 16px 14px;
  }
  .prof-row-expand-inner {
    background: rgba(255,255,255,.55); border-radius: 12px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
    border: 1px solid rgba(255,255,255,.7);
  }
  .prof-row.dimmed { opacity: .5; transition: opacity 200ms ease; }

  /* --- Bio section --- */
  .prof-bio-wrap { padding: 4px 16px 14px; }
  .prof-bio-area {
    width: 100%; min-height: 70px; max-height: 200px;
    border: 1.5px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font-size: 15px; color: var(--ink);
    font-family: inherit; resize: none; outline: none;
    transition: border-color .2s, box-shadow .2s;
    background: #fff; overflow: hidden;
  }
  .prof-bio-area:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(29,78,216,.1); }
  .prof-bio-area:disabled {
    border-color: transparent; background: transparent;
    color: var(--ink); padding-left: 0; resize: none;
  }
  .prof-bio-counter {
    text-align: right; font-size: 12px; color: var(--muted);
    margin-top: 4px; font-weight: 600;
    transition: color 300ms ease;
  }
  .prof-bio-counter.warn { color: var(--warn); }
  .prof-bio-counter.bad { color: var(--bad); }

  /* --- Social links section --- */
  .prof-social-icons {
    display: flex; gap: 10px; padding: 8px 16px 14px; justify-content: space-between;
  }
  .prof-soc-btn {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--bg); border: 1.5px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--muted); cursor: pointer; position: relative;
    transition: background .2s, border-color .2s, color .2s;
    -webkit-tap-highlight-color: transparent;
    flex: 1;
  }
  .prof-soc-btn.linked {
    background: #eef3ff; border-color: var(--brand); color: var(--brand);
  }
  .prof-soc-tick {
    position: absolute; top: -5px; right: -5px;
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--good); border: 2px solid #fff;
    display: none;
  }
  .prof-soc-btn.linked .prof-soc-tick { display: block; }
  .prof-soc-panel {
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height 300ms ease, opacity 250ms ease;
    padding: 0 16px;
  }
  .prof-soc-panel.open {
    max-height: 200px; opacity: 1; padding: 0 16px 14px;
  }
  .prof-soc-panel-inner {
    background: rgba(255,255,255,.55); border-radius: 12px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
    border: 1px solid rgba(255,255,255,.7);
  }
  .prof-soc-input {
    width: 100%; height: 40px; border: 1.5px solid var(--line);
    border-radius: 10px; padding: 0 12px; font-size: 14px;
    color: var(--ink); outline: none; font-family: inherit;
    background: #fff;
    transition: border-color .2s;
  }
  .prof-soc-input:focus { border-color: var(--brand); }
  .prof-soc-actions { display: flex; gap: 8px; }
  .prof-soc-save {
    flex: 1; height: 34px; border-radius: 10px; border: none;
    background: var(--brand); color: #fff; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: opacity .2s;
  }
  .prof-soc-save:active { opacity: .8; }
  .prof-soc-save.saved { background: var(--good); }
  .prof-soc-save:disabled { opacity: .65; cursor: default; }
  .prof-soc-save .row-save-dots {
    display: none; gap: 4px; align-items: center;
  }
  .prof-soc-save .row-save-dots span {
    width: 5px; height: 5px; border-radius: 50%; background: #fff;
    animation: pulse 1s infinite ease-in-out;
  }
  .prof-soc-save .row-save-dots span:nth-child(2) { animation-delay: .18s; }
  .prof-soc-save .row-save-dots span:nth-child(3) { animation-delay: .36s; }
  .prof-soc-remove {
    height: 34px; padding: 0 12px; border-radius: 10px;
    border: 1.5px solid var(--line); background: #fff;
    color: var(--bad); font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit; display: none;
    transition: border-color .2s;
  }
  .prof-soc-remove.visible { display: block; }

  /* card-flip keyframe */
  @keyframes cardFlipOut {
    0%  { transform: rotateY(0deg); }
    100%{ transform: rotateY(90deg); }
  }
  @keyframes cardFlipIn {
    0%  { transform: rotateY(90deg); }
    100%{ transform: rotateY(0deg); }
  }

  /* --- Privacy section --- */
  .prof-privacy-row {
    display: flex; align-items: center;
    padding: 14px 16px; gap: 12px;
  }
  .prof-privacy-row + .prof-privacy-row { border-top: 1px solid var(--line); }
  .prof-privacy-body { flex: 1; }
  .prof-privacy-label { font-size: 15px; font-weight: 600; color: var(--ink); }
  .prof-privacy-sub { font-size: 12px; color: var(--muted); margin-top: 2px; transition: opacity 150ms ease; }

  /* Chip */
  .prof-chip {
    height: 28px; padding: 0 12px; border-radius: 999px;
    border: 1.5px solid var(--brand); background: #eef3ff;
    color: var(--brand); font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: background .2s; -webkit-tap-highlight-color: transparent;
  }
  .prof-chip:active { background: #dce8ff; }

  /* Toggle switch */
  .prof-toggle {
    width: 36px; height: 20px; border-radius: 999px;
    background: var(--muted); position: relative; cursor: pointer;
    transition: background 250ms ease; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .prof-toggle.on { background: var(--brand); }
  .prof-toggle::after {
    content: ""; position: absolute;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; top: 3px; left: 3px;
    transition: left 250ms cubic-bezier(.4,0,.2,1);
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  .prof-toggle.on::after { left: 19px; }

  /* Online status card */
  #profOnlineCard {
    margin: 12px 16px 0;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: 0 6px 22px -10px rgba(15,40,90,.18);
    opacity: 0; transform: translateY(16px);
    animation: profCardIn 300ms cubic-bezier(.4,0,.2,1) 360ms forwards;
    border: 1px solid var(--surface-border);
  }

  /* Username availability indicator */
  .prof-user-status {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%); font-size: 16px;
    display: none;
  }

  /* Loader overlay for profile page */
  #profLoader {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(232,240,255,.85); backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center;
  }
  #profLoader.show { display: flex; }
  .loader-logo{
    width:80px; height:80px; border-radius:50%;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    display:flex; align-items:center; justify-content:center; gap:5px;
    animation: pulse 1.1s infinite ease-in-out;
    box-shadow: 0 18px 40px -10px var(--brand-glow);
  }
  .loader-logo span{width:9px; height:9px; border-radius:50%; background:#fff;}

  /* Wiggle keyframe for bio counter */
  @keyframes wiggle {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(-2deg); }
    75%  { transform: rotate(2deg); }
    100% { transform: rotate(0deg); }
  }

  /* Sign Out button */
  .signout-wrap {
    margin: 16px 16px 0;
  }
  .btn-signout {
    width: 100%; height: 48px; border: 1.5px solid var(--line); border-radius: 14px;
    background: #fff; color: var(--bad); font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit; display: flex; align-items: center;
    justify-content: center; gap: 8px; transition: border-color .2s, background .2s;
  }
  .btn-signout:active { border-color: var(--bad); background: #fff5f5; }

  /* ============================================================
     FLOATING ISLAND BOTTOM TAB BAR
     ============================================================ */
  #tab-island {
    position: fixed;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 440px;
    background: rgba(255, 255, 255, 0.55);
    -webkit-backdrop-filter: blur(28px) saturate(200%);
    backdrop-filter: blur(28px) saturate(200%);
    border: 1.5px solid rgba(255,255,255,0.80);
    border-radius: 28px;
    box-shadow:
      0 8px 32px -8px rgba(29,78,216,.18),
      0 2px 12px -2px rgba(29,78,216,.10),
      0 0 0 1px rgba(255,255,255,.6) inset;
    padding: 8px 8px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 200;
  }
  .tab-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border: none; background: transparent;
    font-size: 10px; font-weight: 800; color: var(--ink);
    cursor: pointer; position: relative; padding: 8px 4px 6px;
    border-radius: 18px; transition: color .22s ease;
    font-family: inherit; letter-spacing: .3px;
    -webkit-tap-highlight-color: transparent; flex: 1 1 0; min-width: 0;
    isolation: isolate;
  }
  .tab-btn i {
    font-size: 22px; transition: transform .25s cubic-bezier(.4,0,.2,1); display: block;
    position: relative; z-index: 1; color: var(--ink-soft);
  }
  .tab-btn span:not(.notif-badge) {
    position: relative; z-index: 1; color: var(--ink-soft);
  }
  .tab-btn::before {
    content: "";
    position: absolute;
    inset: 4px 6px;
    border-radius: 16px;
    transform: scale(.85);
    background: linear-gradient(135deg, var(--brand), var(--brand-2));

  <button class="tab-btn active" data-tab="profile" aria-label="Profile">
    <i class="ph ph-user-circle-fill"></i>
    <span>Profile</span>
  </button>

<div class="toast" id="toast"></div>

<script>
/* =================== CONFIG =================== */
const SUPABASE_URL = "https://akmwzymifytmuinbyeif.supabase.co";
const SUPABASE_KEY = "sb_publishable_QhVT2UQmI0_ZNg47vcs0eg_-jt4hP_A";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =================== HELPERS =================== */
const $ = (s, p=document) => p.querySelector(s);
const $$ = (s, p=document) => Array.from(p.querySelectorAll(s));

function toast(msg, type=""){
  const t = $("#toast");
  const iconMap = { "good": "ph-check-circle", "bad": "ph-warning-circle", "": "ph-info" };
  const iconClass = iconMap[type] || "ph-info";
  t.innerHTML = `<i class="ph ${iconClass} toast-icon"></i><span>${msg}</span>`;
  t.className = "toast show " + type;
  clearTimeout(t._t);
  t._t = setTimeout(()=> t.className = "toast " + type, 3000);
}

function shake(el){
  el.style.animation = "none";
  el.offsetHeight;
  el.style.animation = "btnShake .4s ease";
  setTimeout(() => el.style.animation = "", 400);
}

function vibrate(ms){ if (navigator.vibrate) navigator.vibrate(ms); }

/* =================== OFFLINE =================== */
function updateConn(){
  const off = !navigator.onLine;
  $("#offlineBanner").classList.toggle("show", off);
}
window.addEventListener("online", updateConn);
window.addEventListener("offline", updateConn);
updateConn();

/* =================== SESSION CHECK =================== */
let currentUser = null;

(async () => {
  try {
    const { data } = await sb.auth.getSession();
    if (!data.session) {
      window.location.href = "index.html";
      return;
    }
    currentUser = data.session.user;
    initProfilePage();
  } catch(e) {
    window.location.href = "index.html";
  }
})();

/* =================== TAB BAR NAVIGATION =================== */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    if (tab === 'chats')         window.location.href = 'chats.html';
    else if (tab === 'discover') window.location.href = 'discover.html';
    else if (tab === 'notifications') window.location.href = 'notifications.html';
    // profile tab = already here, do nothing
  });
});

/* =================== SIGN OUT =================== */
$("#btnSignout").addEventListener("click", async () => {
  // Warn user if they have unsaved edits or always confirm sign-out
  if (!confirm("Sign out of NovaChat?")) return;
  if (currentUser) {
    clearInterval(heartbeatInterval);
    try {
      await sb.from("users").update({ is_online: false, last_seen: new Date().toISOString() }).eq("id", currentUser.id);
    } catch(e) {}
  }
  await sb.auth.signOut();
  window.location.href = "index.html";
});

/* =================== PROFILE DATA =================== */
let currentProfile = null;
let heartbeatInterval = null;
let profEditMode = false;
let profUsernameValid = true;
let profActiveSocPlatform = null;
let profOriginalUsername = null;

const SOCIAL_PLATFORMS = {
  instagram: { placeholder: "https://instagram.com/yourhandle", domain: "instagram.com" },
  x:         { placeholder: "https://x.com/yourhandle",        domain: ["x.com","twitter.com"] },
  linkedin:  { placeholder: "https://linkedin.com/in/yourname", domain: "linkedin.com" },
  tiktok:    { placeholder: "https://tiktok.com/@yourhandle",   domain: "tiktok.com" },
  github:    { placeholder: "https://github.com/yourhandle",    domain: "github.com" }
};

function calcCompletion(profile) {
  const fields = [
    profile.avatar_url,
    profile.username,
    profile.bio,
    profile.location,
    profile.social_links && Object.values(profile.social_links).some(v => v)
  ];
  const filled = fields.filter(Boolean).length;
  return Math.round((filled / 5) * 100);
}

function getMissingField(profile) {
  if (!profile.avatar_url)   return "a profile photo";
  if (!profile.username)     return "a username";
  if (!profile.bio)          return "a bio";
  if (!profile.location)     return "a location";
  if (!profile.social_links || !Object.values(profile.social_links).some(v => v))
    return "a social link";
  return null;
}

function animateCompletion(pct) {
  const fill  = $("#profCompFill");
  const label = $("#profCompLabel");
  fill.style.transition = "none";
  fill.style.width = "0%";
  fill.offsetHeight;
  fill.style.transition = "width 600ms cubic-bezier(.4,0,.2,1)";
  setTimeout(() => { fill.style.width = pct + "%"; }, 300);

  const missing = getMissingField(currentProfile);
  if (pct >= 100) {
    label.textContent = "Profile 100% complete 🎉";
  } else {
    label.textContent = `Profile ${pct}% complete${missing ? ` — add ${missing} to improve` : ""}`;
  }
}

function setRowValue(elId, value, fallback, muteWhenEmpty) {
  const el = $("#" + elId);
  if (value) {
    el.textContent = value;
    el.classList.remove("muted");
  } else {
    el.textContent = fallback;
    if (muteWhenEmpty) el.classList.add("muted");
  }
}

function capitalize(str) {
  if (!str) return "";
  return str.charAt(0).toUpperCase() + str.slice(1);
}

function updatePrivChip(chipId, subId, value) {
  $("#" + chipId).textContent = value;
  // sub-label removed (chip alone communicates current state)
}

function updateBioCounter(text) {
  const len = [...text].length;
  const counter = $("#profBioCounter");
  counter.textContent = `${len} / 160`;
  counter.className = "prof-bio-counter";
  if (len >= 155) {
    counter.classList.add("bad");
    counter.style.animation = "none";
    counter.offsetHeight;
    counter.style.animation = "wiggle 400ms cubic-bezier(.4,0,.2,1)";
  } else if (len >= 140) {
    counter.classList.add("warn");
  }
}

function syncPrivacyChipIndices(profile) {
  const priv = profile.privacy_settings || {};
  msgIdx  = priv.messages === "friends" ? 1 : 0;
  const sl = priv.show_last_seen || "everyone";
  seenIdx = sl === "friends" ? 1 : sl === "nobody" ? 2 : 0;
}

function populateProfile(profile) {
  currentProfile = profile;
  profOriginalUsername = profile.username || "";

  // Hero
  $("#profHeroName").textContent = profile.full_name || "No name";
  if (profile.username) {
    $("#profHeroHandle").textContent = "@" + profile.username;
    $("#profHeroHandle").classList.remove("no-handle");
  } else {
    $("#profHeroHandle").textContent = "Add a username";
    $("#profHeroHandle").classList.add("no-handle");
    // Hide verified badge when no username is set — badge on empty state is misleading
    $("#profVerifiedBadge").classList.remove("show");
  }

  // Avatar
  const avatarEl = $("#profAvatar");
  const existingImg = avatarEl.querySelector("img");
  if (existingImg) existingImg.remove();
  if (profile.avatar_url) {
    const img = document.createElement("img");
    img.src = profile.avatar_url;
    img.alt = "Profile photo";
    $("#profAvatarInitials").style.display = "none";
    avatarEl.insertBefore(img, $("#profAvatarInitials"));
  } else {
    const name = profile.full_name || "?";
    const parts = name.trim().split(/\s+/);
    const initials = parts.length >= 2
      ? parts[0][0] + parts[parts.length-1][0]
      : parts[0][0];
    $("#profAvatarInitials").textContent = initials.toUpperCase();
    $("#profAvatarInitials").style.display = "";
  }

  // Online dot
  if (profile.is_online) {
    $("#profOnlineDot").classList.remove("hidden");
  } else {
    $("#profOnlineDot").classList.add("hidden");
  }

  // Basic info rows
  setRowValue("profNameVal", profile.full_name, "—", false);
  setRowValue("profUserVal", profile.username ? "@" + profile.username : null, "Not set", true);
  setRowValue("profLocVal",  profile.location, "Not set", true);
  setRowValue("profPhoneVal",profile.phone_number, "Not added", true);

  // Bio
  const bio = profile.bio || "";
  $("#profBioArea").value = bio;
  updateBioCounter(bio);

  // Social links
  const links = profile.social_links || {};
  Object.keys(SOCIAL_PLATFORMS).forEach(platform => {
    const btn = $(`.prof-soc-btn[data-platform="${platform}"]`);
    if (btn) btn.classList.toggle("linked", !!(links[platform]));
  });

  // Privacy
  const priv = profile.privacy_settings || { messages:"everyone", show_phone:false, show_last_seen:"everyone" };
  updatePrivChip("privMsgChip", "privMsgSub", priv.messages === "everyone" ? "Everyone" : "Friends only");
  updatePrivChip("privSeenChip", "privSeenSub", capitalize(priv.show_last_seen || "everyone"));
  const phoneToggle = $("#privPhoneToggle");
  phoneToggle.classList.toggle("on", !!priv.show_phone);
  $("#privPhoneSub").textContent = priv.show_phone ? "Visible to others" : "Hidden from others";

  // Online toggle
  const onlineToggle = $("#onlineToggle");
  onlineToggle.classList.toggle("on", !!profile.is_online);
  $("#onlineStatusSub").textContent = profile.is_online ? "You appear online" : "You appear offline";

  // Input fields
  $("#profNameInput").value  = profile.full_name    || "";
  $("#profUserInput").value  = profile.username     || "";
  $("#profLocInput").value   = profile.location     || "";
  $("#profPhoneInput").value = profile.phone_number || "";

  // Completion
  animateCompletion(calcCompletion(profile));
  syncPrivacyChipIndices(profile);
}

function setEditMode(on) {
  profEditMode = on;
  $("#profEditBtn").style.display    = on ? "none" : "";
  $("#profSaveBtn").style.display    = on ? "" : "none";
  $("#profCamBtn").classList.toggle("visible", on);

  $("#profBioArea").disabled = !on;
  $("#profBioCounter").style.display = on ? "block" : "none";

  if (!on) {
    $$(".prof-row-expand.open").forEach(el => el.classList.remove("open"));
    $$(".prof-row.dimmed").forEach(el => el.classList.remove("dimmed"));
    if (profActiveSocPlatform) {
      $("#profSocPanel").classList.remove("open");
      profActiveSocPlatform = null;
    }
  }
}

async function initProfilePage() {
  if (!currentUser) return;
  const uid = currentUser.id;

  $("#profLoader").classList.add("show");
  setEditMode(false);

  try {
    const { data, error } = await sb.from("users")
      .select("*").eq("id", uid).single();
    if (error) throw error;
    populateProfile(data);

    const emailConfirmed = currentUser.email_confirmed_at || currentUser.confirmed_at;
    $("#profVerifiedBadge").classList.toggle("show", !!emailConfirmed);

    await sb.from("users")
      .update({ is_online: true, last_seen: new Date().toISOString() })
      .eq("id", uid);
    startHeartbeat();

  } catch(e) {
    if (!navigator.onLine) {
      toast("You're offline", "bad");
    } else {
      toast(e.message || "Failed to load profile", "bad");
    }
  } finally {
    $("#profLoader").classList.remove("show");
  }
}

function startHeartbeat() {
  clearInterval(heartbeatInterval);
  if (!currentUser) return;
  heartbeatInterval = setInterval(async () => {
    if (!currentUser) return;
    try {
      // Verify session is still valid before updating presence
      const { data: sessionData } = await sb.auth.getSession();
      if (!sessionData || !sessionData.session) {
        clearInterval(heartbeatInterval);
        return;
      }
      await sb.from("users")
        .update({ is_online: true, last_seen: new Date().toISOString() })
        .eq("id", currentUser.id);
    } catch(e) {}
  }, 30000);
}

/* ---- Social save ---- */
$("#profSocSave").addEventListener("click", async () => {
  if (!profActiveSocPlatform || !currentUser) return;
  const url = $("#profSocInput").value.trim();
  if (!url) { toast("Enter a URL", "bad"); return; }

  const cfg = SOCIAL_PLATFORMS[profActiveSocPlatform];
  const domains = Array.isArray(cfg.domain) ? cfg.domain : [cfg.domain];
  // Validate the URL starts with the correct origin to prevent spoofing (e.g. evil.com?ref=instagram.com)
  let valid = false;
  try {
    const parsed = new URL(url);
    valid = domains.some(d => parsed.hostname === d || parsed.hostname.endsWith("." + d));
  } catch(_) { valid = false; }
  if (!valid) {
    toast(`Must be a valid ${profActiveSocPlatform} URL`, "bad");
    return;
  }

  try {
    const links = Object.assign({}, (currentProfile && currentProfile.social_links) || {});
    links[profActiveSocPlatform] = url;

    await sb.from("users").update({ social_links: links }).eq("id", currentUser.id);
    currentProfile.social_links = links;

    const btn = $(`.prof-soc-btn[data-platform="${profActiveSocPlatform}"]`);
    btn.style.animation = "cardFlipOut 200ms ease forwards";
    setTimeout(() => {
      btn.classList.add("linked");
      btn.style.animation = "cardFlipIn 200ms ease forwards";
      setTimeout(() => { btn.style.animation = ""; }, 200);
    }, 200);

    $("#profSocPanel").classList.remove("open");
    profActiveSocPlatform = null;

    animateCompletion(calcCompletion(currentProfile));
    toast("Link saved!", "good");
  } catch(e) {
    toast(!navigator.onLine ? "You're offline" : (e.message || "Save failed"), "bad");
  }
});

/* ---- Photo upload ---- */
$("#profCamBtn").addEventListener("click", () => {
  if (!profEditMode) return;
  $("#profFileInput").click();
});

$("#profFileInput").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file || !currentUser) return;
  e.target.value = "";

  const allowed = ["image/jpeg","image/png","image/webp"];
  if (!allowed.includes(file.type)) {
    toast("Please choose a JPEG, PNG or WebP image", "bad");
    return;
  }
  if (file.size > 2 * 1024 * 1024) {
    toast("Image must be under 2MB", "bad");
    return;
  }

  const previewUrl = URL.createObjectURL(file);
  const avatarEl = $("#profAvatar");
  let img = avatarEl.querySelector("img");
  if (!img) {
    img = document.createElement("img");
    img.alt = "Profile photo";
    avatarEl.insertBefore(img, $("#profAvatarInitials"));
    $("#profAvatarInitials").style.display = "none";
  }
  img.src = previewUrl;
  img.style.transform = "scale(.85)";
  img.style.opacity = "0";
  img.style.transition = "transform 300ms ease, opacity 300ms ease";
  setTimeout(() => { img.style.transform = "scale(1)"; img.style.opacity = "1"; }, 30);

  const ring    = $("#profUploadRing");
  const circle  = $("#profRingCircle");
  ring.classList.add("visible");
  circle.style.strokeDashoffset = "283";

  let offset = 283;
  const ringAnim = setInterval(() => {
    offset = Math.max(0, offset - 14);
    circle.style.strokeDashoffset = offset;
    if (offset <= 0) clearInterval(ringAnim);
  }, 80);

  try {
    const bitmap = await createImageBitmap(file);
    const canvas = document.createElement("canvas");
    canvas.width = 300; canvas.height = 300;
    const ctx = canvas.getContext("2d");
    // Center-crop to square (object-fit: cover equivalent) to avoid stretching
    const bw = bitmap.width, bh = bitmap.height;
    const size = Math.min(bw, bh);
    const sx = (bw - size) / 2, sy = (bh - size) / 2;
    ctx.drawImage(bitmap, sx, sy, size, size, 0, 0, 300, 300);
    const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.82));

    const uid = currentUser.id;
    const { error: uploadErr } = await sb.storage
      .from("avatars")
      .upload(`${uid}.jpg`, blob, { contentType: "image/jpeg", upsert: true });
    if (uploadErr) throw uploadErr;

    const { data: pubData } = sb.storage.from("avatars").getPublicUrl(`${uid}.jpg`);
    const avatarUrl = pubData.publicUrl + "?t=" + Date.now();

    await sb.from("users").update({ avatar_url: avatarUrl }).eq("id", uid);
    if (currentProfile) currentProfile.avatar_url = avatarUrl;

    clearInterval(ringAnim);
    circle.style.strokeDashoffset = "0";
    circle.style.stroke = "var(--good)";
    setTimeout(() => {
      ring.classList.remove("visible");
      circle.style.strokeDashoffset = "283";
      circle.style.stroke = "#fff";
    }, 600);

    img.src = avatarUrl;
    URL.revokeObjectURL(previewUrl); // release blob memory on success

    animateCompletion(calcCompletion(currentProfile));
    toast("Photo updated!", "good");
  } catch(err) {
    clearInterval(ringAnim);
    ring.classList.remove("visible");
    circle.style.strokeDashoffset = "283";
    if (currentProfile && currentProfile.avatar_url) {
      img.src = currentProfile.avatar_url;
    } else {
      img.remove();
      $("#profAvatarInitials").style.display = "";
    }
    URL.revokeObjectURL(previewUrl);
    let msg = err && err.message ? err.message : "Upload failed";
    const lower = msg.toLowerCase();
    if (!navigator.onLine) msg = "You're offline";
    else if (lower.includes("bucket") && lower.includes("not found"))
      msg = "Storage bucket 'avatars' is missing";
    else if (lower.includes("row-level") || lower.includes("rls") || lower.includes("policy") || lower.includes("permission"))
      msg = "Upload blocked by storage permissions";
    else if (lower.includes("payload") || lower.includes("too large"))
      msg = "Image is too large";
    else if (lower.includes("mime") || lower.includes("content-type"))
      msg = "Unsupported image type";
    toast(msg, "bad");
  }
});

/* ---- Confetti burst ---- */
function fireConfetti() {
  const bar = $("#profCompFill");
  const rect = bar.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const colors = ["#1d4ed8","#3b82f6","#22c55e","#f59e0b","#ef4444","#a855f7","#fff"];

  for (let i = 0; i < 20; i++) {
    const dot = document.createElement("div");
    dot.style.cssText = `
      position:fixed; width:6px; height:6px; border-radius:50%;
      background:${colors[i % colors.length]};
      left:${cx}px; top:${cy}px; z-index:9999;
      pointer-events:none;
    `;
    document.body.appendChild(dot);
    const angle = Math.random() * Math.PI * 2;
    const dist  = 40 + Math.random() * 40;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    dot.animate([
      { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity: 0 }
    ], { duration: 600 + Math.random() * 200, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" })
      .onfinish = () => dot.remove();
  }
}

/* ---- Save button handler ---- */
let prevCompletion = 0;

$("#profSaveBtn").addEventListener("click", async () => {
  if (!currentUser || !currentProfile) return;

  const newName     = $("#profNameInput").value.trim();
  const newUsername = $("#profUserInput").value.trim();
  const newLocation = $("#profLocInput").value.trim();
  const newPhone    = $("#profPhoneInput").value.trim();
  const newBio      = $("#profBioArea").value.trim();

  if (!newName) {
    toast("Full name is required", "bad");
    return;
  }
  if (newUsername && newUsername !== profOriginalUsername && !profUsernameValid) {
    toast("Please choose a valid username", "bad");
    return;
  }
  if ([...newBio].length > 160) {
    toast("Bio must be 160 characters or less", "bad");
    return;
  }

  const links = (currentProfile.social_links) || {};
  for (const [platform, url] of Object.entries(links)) {
    if (url) {
      const cfg = SOCIAL_PLATFORMS[platform];
      if (cfg) {
        const domains = Array.isArray(cfg.domain) ? cfg.domain : [cfg.domain];
        let urlValid = false;
        try {
          const parsed = new URL(url);
          urlValid = domains.some(d => parsed.hostname === d || parsed.hostname.endsWith("." + d));
        } catch(_) { urlValid = false; }
        if (!urlValid) {
          toast(`Invalid ${platform} URL`, "bad");
          return;
        }
      }
    }
  }

  const btnTextEl = $("#profSaveBtnText");
  const dotsEl    = $("#profSaveDots");
  btnTextEl.style.display = "none";
  dotsEl.style.display    = "flex";
  $("#profSaveBtn").disabled = true;

  const updates = {};
  if (newName !== currentProfile.full_name) updates.full_name = newName;
  if (newUsername && newUsername !== profOriginalUsername) updates.username = newUsername;
  if (newLocation !== (currentProfile.location || "")) updates.location = newLocation || null;
  if (newPhone !== (currentProfile.phone_number || "")) updates.phone_number = newPhone || null;
  if (newBio !== (currentProfile.bio || "")) updates.bio = newBio || null;

  try {
    if (Object.keys(updates).length > 0) {
      const { error } = await sb.from("users").update(updates).eq("id", currentUser.id);
      if (error) throw error;
    }

    const wasFirstUsername = !profOriginalUsername && newUsername;

    Object.assign(currentProfile, updates);
    prevCompletion = calcCompletion(currentProfile);

    btnTextEl.style.display = "";
    dotsEl.style.display    = "none";
    $("#profSaveBtn").style.background = "var(--good)";
    $("#profSaveBtn").innerHTML = '<i class="ph ph-check" style="font-size:18px;"></i>';
    setTimeout(() => {
      $("#profSaveBtn").style.background = "";
      $("#profSaveBtn").innerHTML = '<span id="profSaveBtnText">Save</span><span class="save-dots" id="profSaveDots" style="display:none"><span></span><span></span><span></span></span>';
    }, 600);

    setEditMode(false);
    populateProfile(currentProfile);

    profOriginalUsername = currentProfile.username || "";

    const newPct = calcCompletion(currentProfile);
    animateCompletion(newPct);
    if (newPct === 100 && prevCompletion < 100) {
      setTimeout(fireConfetti, 700);
    }

    if (wasFirstUsername) {
      toast(`Your handle @${newUsername} is live! 🎉`, "good");
    } else {
      toast("Profile saved! ✓", "good");
    }
    vibrate(80);

  } catch(e) {
    btnTextEl.style.display = "";
    dotsEl.style.display    = "none";
    $("#profSaveBtn").disabled = false;
    shake($("#profSaveBtn"));

    if (e.message && e.message.toLowerCase().includes("unique")) {
      toast("That username was just taken, try another", "bad");
    } else {
      toast(!navigator.onLine ? "You're offline" : (e.message || "Save failed"), "bad");
    }
  } finally {
    $("#profSaveBtn").disabled = false;
  }
});

/* =================== INLINE PER-ROW SAVE HANDLERS =================== */
(function() {
  const FIELD_TO_INPUT = {
    full_name:    "profNameInput",
    username:     "profUserInput",
    location:     "profLocInput",
    phone_number: "profPhoneInput"
  };
  const FIELD_TO_VAL = {
    full_name:    "profNameVal",
    username:     "profUserVal",
    location:     "profLocVal",
    phone_number: "profPhoneVal"
  };
  const FIELD_TO_EXPAND = {
    full_name:    "profNameExpand",
    username:     "profUserExpand",
    location:     "profLocExpand",
    phone_number: "profPhoneExpand"
  };

  document.querySelectorAll(".prof-row-save").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!currentUser || !currentProfile) return;
      const field = btn.dataset.rowSave;
      const inputId = FIELD_TO_INPUT[field];
      const valId   = FIELD_TO_VAL[field];
      const input = document.getElementById(inputId);
      const raw = (input.value || "").trim();

      if (field === "full_name" && !raw) {
        shake(btn); toast("Full name is required", "bad"); return;
      }
      if (field === "username") {
        if (raw && raw !== profOriginalUsername && !profUsernameValid) {
          shake(btn); toast("Please choose a valid username", "bad"); return;
        }
      }

      const value = raw === "" ? null : raw;
      if (value === (currentProfile[field] || null)) {
        document.getElementById(FIELD_TO_EXPAND[field]).classList.remove("open");
        return;
      }

      const txt  = btn.querySelector(".row-save-text");
      const dots = btn.querySelector(".row-save-dots");
      txt.style.display = "none";
      dots.style.display = "flex";
      btn.disabled = true;

      try {
        const { error } = await sb.from("users")
          .update({ [field]: value })
          .eq("id", currentUser.id);
        if (error) throw error;

        currentProfile[field] = value;
        if (field === "username") profOriginalUsername = value || "";

        const valEl = document.getElementById(valId);
        if (valEl) {
          if (value) {
            valEl.textContent = field === "username" ? "@" + value : value;
            valEl.classList.remove("muted");
          } else {
            valEl.textContent = field === "phone_number" ? "Not added" : "Not set";
            valEl.classList.add("muted");
          }
        }

        btn.classList.add("saved");
        dots.style.display = "none";
        btn.innerHTML = '<i class="ph ph-check" style="font-size:18px;"></i>';
        vibrate(40);

        setTimeout(() => {
          document.getElementById(FIELD_TO_EXPAND[field]).classList.remove("open");
          document.querySelectorAll(".prof-row.dimmed").forEach(el => el.classList.remove("dimmed"));
          btn.classList.remove("saved");
          btn.disabled = false;
          btn.innerHTML =
            '<span class="row-save-text">Save</span>' +
            '<span class="row-save-dots" style="display:none"><span></span><span></span><span></span></span>';
          animateCompletion(calcCompletion(currentProfile));
        }, 650);

      } catch(err) {
        txt.style.display = "";
        dots.style.display = "none";
        btn.disabled = false;
        shake(btn);
        const m = (err && err.message || "").toLowerCase();
        if (m.includes("unique")) toast("That username was just taken", "bad");
        else toast(!navigator.onLine ? "You're offline" : (err.message || "Save failed"), "bad");
      }
    });
  });
})();
