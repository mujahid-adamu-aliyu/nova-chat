<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1d4ed8" />
<title>NovaChat — Chat</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='30' r='26' fill='%231d4ed8'/><circle cx='22' cy='30' r='3.2' fill='white'/><circle cx='32' cy='30' r='3.2' fill='white'/><circle cx='42' cy='30' r='3.2' fill='white'/><path d='M26 52 L32 60 L38 52 Z' fill='%231d4ed8'/></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
/* ====== CSS VARIABLES ====== */
:root{
  --bg:#c8d9f5;
  --card:#ffffff;
  --card-2:#f8faff;
  --ink:#0b1b3a;
  --ink-soft:#5b6b8c;
  --muted:#9aa6c2;
  --line:#dde8f8;
  --surface:#eaf2ff;
  --surface-2:#dbe7fb;
  --surface-border:#c7daf3;
  --brand:#1d4ed8;
  --brand-2:#2563eb;
  --brand-3:#60a5fa;
  --brand-glow:rgba(29,78,216,.45);
  --good:#22c55e;
  --warn:#f59e0b;
  --bad:#ef4444;
  --radius:9px;
  --radius-lg:13px;
  --shadow-sm:0 8px 24px -6px rgba(15,40,120,.22);
  --shadow:0 20px 50px -14px rgba(15,40,120,.32);
  --transition:.25s cubic-bezier(.4,.0,.2,1);
  --spring:cubic-bezier(.34,1.4,.64,1);

  /* Bubble colours */
  --bubble-out-bg: linear-gradient(135deg, var(--brand), var(--brand-2));
  --bubble-out-text: #fff;
  --bubble-in-bg: #ffffff;
  --bubble-in-text: var(--ink);
  --bubble-in-border: rgba(199,218,243,.6);
}

/* ====== DARK THEME ====== */
[data-theme="dark"]{
  --bg:#0b1220;
  --card:#1a2540;
  --card-2:#1e2d4a;
  --ink:#f1f5f9;
  --ink-soft:#94a3b8;
  --muted:#64748b;
  --line:#334155;
  --surface:#0f172a;
  --surface-2:#1e293b;
  --surface-border:#334155;
  --bubble-in-bg:#1e2d4a;
  --bubble-in-text:#f1f5f9;
  --bubble-in-border:#334155;
  --shadow-sm:0 8px 24px -6px rgba(0,0,0,.45);
  --shadow:0 20px 50px -14px rgba(0,0,0,.55);
}
[data-theme="dark"] body{
  background:
    radial-gradient(ellipse 110% 60% at 60% 0%, #0d1f3c 0%, transparent 65%),
    radial-gradient(ellipse 80% 70% at -5% 100%, #0a1628 0%, transparent 60%),
    var(--bg);
}
[data-theme="dark"] .header{background:rgba(30,41,59,.95);border-color:#334155;}
[data-theme="dark"] .input-island{background:rgba(20,31,54,.92);border-color:#334155;color:#f1f5f9;}
[data-theme="dark"] .input-island::placeholder{color:#64748b;}
[data-theme="dark"] .send-island{background:var(--brand);}
[data-theme="dark"] .attach-island{background:rgba(20,31,54,.92);border-color:#334155;color:#94a3b8;}
[data-theme="dark"] .date-chip{background:rgba(20,31,54,.85);color:#94a3b8;border-color:#334155;}
[data-theme="dark"] .bubble-in{background:var(--bubble-in-bg);border-color:var(--bubble-in-border);color:var(--bubble-in-text);}
[data-theme="dark"] .seen-label{color:#64748b;}
[data-theme="dark"] .header-name{color:#f1f5f9;}
[data-theme="dark"] .header-status{color:#64748b;}
[data-theme="dark"] .back-btn{color:#94a3b8;}
[data-theme="dark"] .img-overlay{background:rgba(0,0,0,.85);}

/* ====== RESET ====== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{-webkit-user-select:none;-moz-user-select:none;user-select:none;}
textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text;}
button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;}

body{
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse 110% 60% at 60% 0%, #a8c4f0 0%, transparent 65%),
    radial-gradient(ellipse 80% 70% at -5% 100%, #9ab8ee 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 100% 60%, #b0ccf5 0%, transparent 55%),
    var(--bg);
  min-height:100vh;
  overflow:hidden; /* no body scroll — messages area scrolls */
}

/* ====== OFFLINE ====== */
.offline{
  position:fixed;top:0;left:0;right:0;
  background:var(--bad);color:#fff;
  text-align:center;padding:6px 10px;
  font-size:13px;font-weight:600;z-index:300;
  transform:translateY(-100%);transition:transform .3s;
}
.offline.show{transform:translateY(0);}

/* ====== LOADER ====== */
.loader{
  position:fixed;inset:0;z-index:999;
  background:var(--bg);
  display:grid;place-items:center;
  transition:opacity .35s ease;
}
.loader.hide{opacity:0;pointer-events:none;}
.spin{
  width:36px;height:36px;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--brand);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ====== LAYOUT SHELL ====== */
.shell{
  max-width:440px;
  margin:0 auto;
  height:100dvh; /* dynamic viewport height — respects keyboard */
  display:flex;
  flex-direction:column;
  position:relative;
}

/* ====== HEADER ====== */
.header{
  flex-shrink:0;
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
  background:rgba(246,250,255,.95);
  backdrop-filter:blur(12px) saturate(140%);
  -webkit-backdrop-filter:blur(12px) saturate(140%);
  border-bottom:1px solid rgba(199,218,243,.6);
  box-shadow:0 4px 20px -8px rgba(15,40,120,.18);
  z-index:10;
  /* Entrance animation */
  animation:headerSlideDown .45s var(--spring) both;
}
@keyframes headerSlideDown{
  from{transform:translateY(-100%);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}

.back-btn{
  width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;
  color:var(--ink-soft);flex-shrink:0;
  transition:transform var(--transition),background var(--transition);
}
.back-btn:active{transform:scale(.88);background:var(--surface);}
.back-btn i{font-size:22px;}

.header-avatar{
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;
  font-weight:700;font-size:14px;color:#fff;
  flex-shrink:0;position:relative;
  box-shadow:0 3px 10px -3px rgba(0,0,60,.2);
}
.header-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.header-online-dot{
  position:absolute;right:0;bottom:0;
  width:11px;height:11px;border-radius:50%;
  background:var(--good);
  border:2px solid rgba(246,250,255,.95);
  display:none;
}
.header-online-dot.show{display:block;}

.header-info{flex:1;min-width:0;}
.header-name{font-size:15px;font-weight:700;color:var(--ink);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-status{font-size:11px;font-weight:500;color:var(--muted);margin-top:1px;}
.header-status.online{color:var(--good);}

.header-actions{display:flex;gap:6px;flex-shrink:0;}
.hdr-btn{
  width:36px;height:36px;border-radius:9px;
  display:grid;place-items:center;
  color:var(--ink-soft);
  background:rgba(219,231,251,.5);
  border:1px solid rgba(199,218,243,.5);
  transition:transform var(--transition),background var(--transition);
}
.hdr-btn:active{transform:scale(.88);}
.hdr-btn i{font-size:18px;}

/* Theme toggle in header */
#themeToggle{
  width:36px;height:36px;border-radius:9px;
  display:grid;place-items:center;
  color:var(--ink-soft);
  background:rgba(219,231,251,.5);
  border:1px solid rgba(199,218,243,.5);
  transition:transform var(--transition);
}
#themeToggle:active{transform:scale(.88);}
#themeToggle i{font-size:18px;transition:transform .25s var(--spring);}
@keyframes themeShake{
  0%{transform:rotate(0);}20%{transform:rotate(-18deg);}
  40%{transform:rotate(18deg);}60%{transform:rotate(-12deg);}
  80%{transform:rotate(10deg);}100%{transform:rotate(0);}
}
#themeToggle.shaking i{animation:themeShake .4s ease;}

/* ====== MESSAGES AREA ====== */
.messages-area{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:16px 14px 12px;
  display:flex;
  flex-direction:column;
  gap:4px;
  scroll-behavior:smooth;
}
.messages-area::-webkit-scrollbar{display:none;}
.messages-area{scrollbar-width:none;}

/* ====== DATE CHIP ====== */
.date-chip{
  align-self:center;
  font-size:11px;font-weight:600;
  color:var(--muted);
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(8px);
  border:1px solid rgba(199,218,243,.5);
  border-radius:999px;
  padding:4px 14px;
  margin:10px 0 6px;
  letter-spacing:.3px;
}

/* ====== BUBBLES ====== */
.bubble-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
  max-width:82%;
}
.bubble-row.out{
  align-self:flex-end;
  flex-direction:row-reverse;
}
.bubble-row.in{
  align-self:flex-start;
}

/* Tiny avatar for incoming (only shown on first in group) */
.bubble-mini-avatar{
  width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;
  font-size:10px;font-weight:700;color:#fff;
  flex-shrink:0;
  box-shadow:0 2px 6px -2px rgba(0,0,60,.2);
  opacity:0;
  transition:opacity .2s;
}
.bubble-mini-avatar.show{opacity:1;}

.bubble{
  padding:10px 14px;
  border-radius:18px;
  font-size:14px;font-weight:500;
  line-height:1.5;
  word-break:break-word;
  position:relative;
  max-width:100%;
}

/* Outgoing */
.bubble-out .bubble{
  background:var(--bubble-out-bg);
  color:var(--bubble-out-text);
  border-bottom-right-radius:5px;
  box-shadow:0 6px 20px -6px var(--brand-glow);
}

/* Incoming */
.bubble-in .bubble{
  background:var(--bubble-in-bg);
  color:var(--bubble-in-text);
  border:1px solid var(--bubble-in-border);
  border-bottom-left-radius:5px;
  box-shadow:0 4px 14px -6px rgba(15,40,120,.12);
}

/* Timestamp */
.bubble-time{
  font-size:10px;font-weight:500;
  color:rgba(255,255,255,.65);
  display:block;
  text-align:right;
  margin-top:4px;
}
.bubble-in .bubble-time{color:var(--muted);}

/* Seen receipt */
.seen-wrap{
  display:flex;justify-content:flex-end;
  padding-right:4px;
  margin-top:2px;
  margin-bottom:4px;
  min-height:14px;
}
.seen-label{
  font-size:10px;font-weight:600;
  color:var(--brand-3);
  opacity:0;
  transform:translateY(4px);
  transition:opacity .3s ease,transform .3s var(--spring);
}
.seen-label.show{opacity:1;transform:translateY(0);}

/* Image bubble */
.bubble-img{
  max-width:220px;max-height:260px;
  border-radius:14px;
  object-fit:cover;
  display:block;
  cursor:pointer;
  opacity:0;
  transition:opacity .4s ease, transform .3s var(--spring);
  transform:scale(.96);
}
.bubble-img.loaded{opacity:1;transform:scale(1);}
.bubble-img-wrap{
  padding:4px;
  border-radius:16px;
  overflow:hidden;
}

/* ====== BUBBLE ENTRANCE ANIMATIONS ====== */
@keyframes bubbleInRight{
  from{opacity:0;transform:translateX(18px) scale(.92);}
  to{opacity:1;transform:translateX(0) scale(1);}
}
@keyframes bubbleInLeft{
  from{opacity:0;transform:translateX(-18px) scale(.92);}
  to{opacity:1;transform:translateX(0) scale(1);}
}
@keyframes bubbleInRightSpring{
  0%{opacity:0;transform:translateX(18px) scale(.88);}
  60%{transform:translateX(-4px) scale(1.03);}
  80%{transform:translateX(2px) scale(.99);}
  100%{opacity:1;transform:translateX(0) scale(1);}
}
.bubble-row.out.animate{animation:bubbleInRightSpring .42s var(--spring) both;}
.bubble-row.in.animate{animation:bubbleInLeft .38s var(--spring) both;}

/* ====== EMPTY STATE ====== */
.empty-msgs{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:32px;
  gap:10px;color:var(--muted);
  animation:fadeIn .5s ease both .2s;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.empty-msgs i{font-size:48px;color:var(--surface-border);}
.empty-msgs p{font-size:14px;font-weight:600;margin:0;color:var(--ink-soft);}
.empty-msgs small{font-size:12px;}

/* ====== INPUT BAR ====== */
.input-bar{
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  /* Entrance animation */
  animation:inputSlideUp .45s var(--spring) both .1s;
}
@keyframes inputSlideUp{
  from{transform:translateY(100%);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}

/* Attach island */
.attach-island{
  width:46px;height:46px;
  border-radius:14px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(199,218,243,.7);
  box-shadow:0 6px 20px -6px rgba(15,40,120,.18);
  display:grid;place-items:center;
  color:var(--ink-soft);
  flex-shrink:0;
  transition:transform var(--transition),background var(--transition),opacity var(--transition);
  cursor:pointer;
}
.attach-island:active{transform:scale(.90);}
.attach-island i{font-size:20px;}
.attach-island.hidden{
  opacity:0;pointer-events:none;transform:scale(.8);
}

/* Input island */
.input-island{
  flex:1;
  min-height:46px;max-height:130px;
  border-radius:14px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(199,218,243,.7);
  box-shadow:0 6px 20px -6px rgba(15,40,120,.18);
  padding:12px 14px;
  font-family:'Poppins',sans-serif;
  font-size:14px;font-weight:500;
  color:var(--ink);
  outline:none;
  resize:none;
  overflow-y:auto;
  line-height:1.45;
  transition:border-color var(--transition),box-shadow var(--transition),height .2s var(--spring);
  scrollbar-width:none;
}
.input-island::-webkit-scrollbar{display:none;}
.input-island::placeholder{color:var(--muted);}
.input-island:focus{
  border-color:var(--brand-3);
  box-shadow:0 0 0 3px rgba(96,165,250,.18), 0 6px 20px -6px rgba(15,40,120,.18);
}

/* Send island */
.send-island{
  width:46px;height:46px;
  border-radius:14px;
  background:linear-gradient(135deg, var(--brand), var(--brand-2));
  box-shadow:0 8px 24px -6px var(--brand-glow);
  display:grid;place-items:center;
  color:#fff;
  flex-shrink:0;
  border:none;cursor:pointer;
  transition:transform var(--transition),box-shadow var(--transition),opacity var(--transition);
  opacity:0;
  transform:scale(.7);
  pointer-events:none;
}
.send-island.show{
  opacity:1;transform:scale(1);pointer-events:auto;
}
.send-island:active{transform:scale(.88);box-shadow:0 4px 12px -4px var(--brand-glow);}
.send-island i{font-size:20px;}

/* Hidden file input */
#fileInput{display:none;}

/* ====== FULLSCREEN IMAGE OVERLAY ====== */
.img-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.92);
  display:grid;place-items:center;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease;
}
.img-overlay.show{opacity:1;pointer-events:auto;}
.img-overlay img{
  max-width:calc(100vw - 32px);
  max-height:calc(100dvh - 80px);
  border-radius:16px;
  object-fit:contain;
  transform:scale(.9);
  transition:transform .35s var(--spring);
  box-shadow:0 24px 60px -12px rgba(0,0,0,.6);
}
.img-overlay.show img{transform:scale(1);}
.img-overlay-close{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(8px);
  display:grid;place-items:center;
  color:#fff;font-size:22px;
  transition:background var(--transition),transform var(--transition);
}
.img-overlay-close:active{background:rgba(255,255,255,.25);transform:scale(.9);}
</style>
</head>
<body>

<div class="offline" id="offline">You're offline — check your connection</div>
<div class="loader" id="loader"><div class="spin"></div></div>

<!-- FULLSCREEN IMAGE VIEWER -->
<div class="img-overlay" id="imgOverlay">
  <button class="img-overlay-close" id="imgOverlayClose"><i class="ph ph-x"></i></button>
  <img id="imgOverlayImg" src="" alt="Photo" />
</div>

<div class="shell">

  <!-- HEADER -->
  <header class="header" id="header">
    <button class="back-btn" id="backBtn" onclick="goBack()">
      <i class="ph ph-arrow-left"></i>
    </button>

    <div class="header-avatar" id="headerAvatar">
      <span class="header-online-dot" id="headerDot"></span>
    </div>

    <div class="header-info">
      <div class="header-name" id="headerName">…</div>
      <div class="header-status" id="headerStatus">Loading…</div>
    </div>

    <div class="header-actions">
      <button class="hdr-btn" title="Voice call" onclick="notReady()">
        <i class="ph ph-phone"></i>
      </button>
      <button id="themeToggle" title="Toggle theme">
        <i class="ph ph-moon" id="themeIcon"></i>
      </button>
    </div>
  </header>

  <!-- MESSAGES -->
  <div class="messages-area" id="messagesArea"></div>

  <!-- INPUT BAR -->
  <div class="input-bar" id="inputBar">
    <button class="attach-island" id="attachBtn" title="Attach image">
      <i class="ph ph-image"></i>
    </button>

    <textarea
      class="input-island"
      id="msgInput"
      placeholder="Message…"
      rows="1"
    ></textarea>

    <button class="send-island" id="sendBtn" title="Send">
      <i class="ph ph-paper-plane-tilt"></i>
    </button>
  </div>

  <input type="file" id="fileInput" accept="image/*" />
</div>

<script>
/* ============ Supabase ============ */
const SUPABASE_URL = "https://yjfxoximfczrtfgnnqyc.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqZnhveGltZmN6cnRmZ25ucXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MzAwMTksImV4cCI6MjA5NDEwNjAxOX0.rGIpoYFYZ6q6Dz_7etlEqnjKp55BeYp1Iqay-__kfjA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
function vibrate(ms){ navigator.vibrate && navigator.vibrate(ms); }

const AVATAR_COLORS = [
  ["#a8c4f0","#1d4ed8"], ["#c4b5fd","#7c3aed"], ["#86efac","#16a34a"],
  ["#fca5a5","#dc2626"], ["#fde68a","#d97706"], ["#a5f3fc","#0891b2"],
  ["#f9a8d4","#db2777"], ["#bfdbfe","#2563eb"],
];
function avatarColor(str){
  let hash = 0;
  for(let c of (str||"")) hash = (hash*31 + c.charCodeAt(0)) & 0xffffffff;
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
function initialsOf(name){
  if(!name) return "?";
  return name.trim().split(/\s+/).slice(0,2).map(s=>s[0].toUpperCase()).join("");
}

function fmtTime(ts){
  if(!ts) return "";
  const d = new Date(ts);
  const h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? "pm" : "am";
  return `${h % 12 || 12}:${String(m).padStart(2,"0")} ${ampm}`;
}

function fmtDateChip(ts){
  const d = new Date(ts);
  const now = new Date();
  const today = new Date(); today.setHours(0,0,0,0);
  const msgDay = new Date(d); msgDay.setHours(0,0,0,0);
  const diff = Math.round((today - msgDay) / 86400000);
  if(diff === 0) return "Today";
  if(diff === 1) return "Yesterday";
  if(diff < 7) return d.toLocaleDateString("en",{weekday:"long"});
  return d.toLocaleDateString("en",{month:"long", day:"numeric", year:"numeric"});
}

function sameDay(a, b){
  const da = new Date(a), db = new Date(b);
  return da.getFullYear()===db.getFullYear() && da.getMonth()===db.getMonth() && da.getDate()===db.getDate();
}

function goBack(){
  vibrate(20);
  window.location.href = "chats.html";
}

function notReady(){
  vibrate(20);
}

/* ============ State ============ */
let currentUser = null;
let partnerId = null;
let partner = null;
let messages = [];
let lastSeenMsgId = null;

/* ============ URL Param ============ */
const params = new URLSearchParams(window.location.search);
partnerId = params.get("user");
if(!partnerId){ window.location.href = "chats.html"; }

/* ============ Render Messages ============ */
function renderMessages(animate = false){
  const area = $("#messagesArea");
  if(messages.length === 0){
    area.innerHTML = `
      <div class="empty-msgs">
        <i class="ph ph-chat-circle-dots"></i>
        <p>No messages yet</p>
        <small>Say hello! 👋</small>
      </div>`;
    return;
  }

  const [bg, fg] = avatarColor(partnerId);
  const initials = partner ? initialsOf(partner.full_name || partner.username) : "?";
  const partnerAvatar = partner?.avatar_url
    ? `<img src="${partner.avatar_url}" alt="${initials}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`
    : initials;

  let html = "";
  let lastDate = null;
  let lastSenderId = null;

  messages.forEach((msg, i) => {
    const isOut = msg.sender_id === currentUser.id;
    const isNewDay = !lastDate || !sameDay(lastDate, msg.created_at);
    const isFirstInGroup = msg.sender_id !== lastSenderId;
    const animClass = animate ? " animate" : "";

    if(isNewDay){
      html += `<div class="date-chip">${fmtDateChip(msg.created_at)}</div>`;
      lastDate = msg.created_at;
    }

    // Mini avatar — show for first incoming message in a group
    const showAvatar = !isOut && isFirstInGroup;

    let bubbleContent = "";
    if(msg.type === "image" && msg.media_url){
      bubbleContent = `
        <div class="bubble-img-wrap">
          <img class="bubble-img" src="${msg.media_url}" alt="Photo"
            onload="this.classList.add('loaded')"
            onclick="openImg('${msg.media_url}')" />
        </div>
        <span class="bubble-time">${fmtTime(msg.created_at)}</span>`;
    } else {
      bubbleContent = `
        ${escHtml(msg.content || "")}
        <span class="bubble-time">${fmtTime(msg.created_at)}</span>`;
    }

    html += `
      <div class="bubble-row ${isOut ? "out" : "in"}${animClass}" data-id="${msg.id}" style="animation-delay:${animate ? i * 18 : 0}ms">
        <div class="bubble-mini-avatar${showAvatar ? " show" : ""}"
          style="background:linear-gradient(135deg,${bg},${fg})">
          ${showAvatar ? partnerAvatar : ""}
        </div>
        <div class="bubble ${isOut ? "bubble-out" : "bubble-in"}">
          ${bubbleContent}
        </div>
      </div>`;

    // Seen receipt under last outgoing message
    if(isOut && i === messages.length - 1){
      const isRead = msg.is_read;
      html += `<div class="seen-wrap"><span class="seen-label${isRead ? " show" : ""}" id="seenLabel">Seen</span></div>`;
    }

    lastSenderId = msg.sender_id;
  });

  area.innerHTML = html;
  scrollToBottom();
}

function escHtml(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}

function scrollToBottom(smooth = false){
  const area = $("#messagesArea");
  area.scrollTo({ top: area.scrollHeight, behavior: smooth ? "smooth" : "instant" });
}

/* ============ Open full image ============ */
function openImg(url){
  $("#imgOverlayImg").src = url;
  $("#imgOverlay").classList.add("show");
  vibrate(20);
}
$("#imgOverlayClose").addEventListener("click", ()=>{
  $("#imgOverlay").classList.remove("show");
  setTimeout(()=>{ $("#imgOverlayImg").src = ""; }, 300);
});
$("#imgOverlay").addEventListener("click", e=>{
  if(e.target === $("#imgOverlay")) $("#imgOverlayClose").click();
});

/* ============ Mark Messages Read ============ */
async function markRead(){
  await sb.from("messages")
    .update({ is_read: true })
    .eq("sender_id", partnerId)
    .eq("receiver_id", currentUser.id)
    .eq("is_read", false);
}

/* ============ Load Messages ============ */
async function loadMessages(){
  const { data, error } = await sb.from("messages")
    .select("*")
    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${partnerId}),and(sender_id.eq.${partnerId},receiver_id.eq.${currentUser.id})`)
    .order("created_at", { ascending: true });

  if(error){ console.error(error); return; }
  messages = data || [];
  renderMessages(true);
  await markRead();
}

/* ============ Load Partner Profile ============ */
async function loadPartner(){
  const { data } = await sb.from("profiles")
    .select("id,full_name,username,avatar_url,is_online,last_seen")
    .eq("id", partnerId)
    .single();

  if(!data) return;
  partner = data;

  // Header avatar
  const [bg, fg] = avatarColor(partner.id);
  const initials = initialsOf(partner.full_name || partner.username);
  const avatarEl = $("#headerAvatar");
  avatarEl.style.background = `linear-gradient(135deg,${bg},${fg})`;
  if(partner.avatar_url){
    avatarEl.innerHTML = `<img src="${partner.avatar_url}" alt="${initials}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" /><span class="header-online-dot${partner.is_online?" show":""}"></span>`;
  } else {
    avatarEl.innerHTML = `${initials}<span class="header-online-dot${partner.is_online?" show":""}"></span>`;
  }

  // Header text
  $("#headerName").textContent = partner.full_name || partner.username || "Unknown";
  updateStatus();
}

function updateStatus(){
  if(!partner) return;
  const el = $("#headerStatus");
  if(partner.is_online){
    el.textContent = "Online";
    el.className = "header-status online";
  } else {
    el.textContent = partner.last_seen ? "Last seen " + fmtLastSeen(partner.last_seen) : "Offline";
    el.className = "header-status";
  }
}

function fmtLastSeen(ts){
  const d = new Date(ts), now = new Date();
  const diff = (now - d) / 1000;
  if(diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if(diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  if(diff < 172800) return "yesterday";
  return d.toLocaleDateString("en",{month:"short",day:"numeric"});
}

/* ============ Send Text ============ */
async function sendMessage(){
  const input = $("#msgInput");
  const text = input.value.trim();
  if(!text) return;

  // Clear input & blur immediately
  input.value = "";
  input.style.height = "auto";
  input.blur(); // keyboard dismisses, no re-focus
  toggleSendBtn();
  vibrate(25);

  // Optimistic bubble
  const tempMsg = {
    id: "temp-" + Date.now(),
    sender_id: currentUser.id,
    receiver_id: partnerId,
    content: text,
    type: "text",
    media_url: null,
    is_read: false,
    created_at: new Date().toISOString(),
  };
  messages.push(tempMsg);
  renderMessages(false);

  // Mark new bubble with spring animation
  const rows = $("#messagesArea").querySelectorAll(".bubble-row.out");
  const last = rows[rows.length - 1];
  if(last){ last.classList.add("animate"); }

  scrollToBottom(true);

  // Insert to DB
  const { data, error } = await sb.from("messages").insert({
    sender_id: currentUser.id,
    receiver_id: partnerId,
    content: text,
    type: "text",
  }).select().single();

  if(error){
    // Remove optimistic
    messages = messages.filter(m => m.id !== tempMsg.id);
    renderMessages(false);
    return;
  }

  // Replace temp with real
  const idx = messages.findIndex(m => m.id === tempMsg.id);
  if(idx > -1) messages[idx] = data;
}

/* ============ Send Image ============ */
async function sendImage(file){
  if(!file) return;
  vibrate(20);

  const ext = file.name.split(".").pop() || "jpg";
  const path = `chat-images/${currentUser.id}/${Date.now()}.${ext}`;

  // Optimistic bubble with local preview
  const localUrl = URL.createObjectURL(file);
  const tempMsg = {
    id: "temp-img-" + Date.now(),
    sender_id: currentUser.id,
    receiver_id: partnerId,
    content: null,
    type: "image",
    media_url: localUrl,
    is_read: false,
    created_at: new Date().toISOString(),
  };
  messages.push(tempMsg);
  renderMessages(false);
  scrollToBottom(true);

  const rows = $("#messagesArea").querySelectorAll(".bubble-row.out");
  const last = rows[rows.length - 1];
  if(last){ last.classList.add("animate"); }

  // Upload to storage
  const { error: upErr } = await sb.storage
    .from("chat-images")
    .upload(path, file, { cacheControl: "3600", upsert: false });

  if(upErr){ console.error(upErr); messages = messages.filter(m=>m.id!==tempMsg.id); renderMessages(false); return; }

  const { data: urlData } = sb.storage.from("chat-images").getPublicUrl(path);
  const publicUrl = urlData.publicUrl;

  // Insert message
  const { data, error } = await sb.from("messages").insert({
    sender_id: currentUser.id,
    receiver_id: partnerId,
    content: null,
    type: "image",
    media_url: publicUrl,
  }).select().single();

  if(error){ messages = messages.filter(m=>m.id!==tempMsg.id); renderMessages(false); return; }

  const idx = messages.findIndex(m => m.id === tempMsg.id);
  if(idx > -1) messages[idx] = data;
  URL.revokeObjectURL(localUrl);
}

/* ============ Input Behaviour ============ */
const input = $("#msgInput");
const sendBtn = $("#sendBtn");
const attachBtn = $("#attachBtn");

function toggleSendBtn(){
  const hasText = input.value.trim().length > 0;
  sendBtn.classList.toggle("show", hasText);
  attachBtn.classList.toggle("hidden", hasText);
}

// Auto-grow textarea
function autoGrow(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 130) + "px";
}

input.addEventListener("input", ()=>{ autoGrow(); toggleSendBtn(); });
input.addEventListener("keydown", e=>{
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener("click", sendMessage);

attachBtn.addEventListener("click", ()=>{ $("#fileInput").click(); vibrate(15); });
$("#fileInput").addEventListener("change", e=>{
  const file = e.target.files?.[0];
  if(file) sendImage(file);
  e.target.value = ""; // reset so same file can be picked again
});

/* ============ Theme ============ */
(function(){
  const btn = $("#themeToggle");
  const icon = $("#themeIcon");
  const html = document.documentElement;
  function applyTheme(dark){
    if(dark){ html.setAttribute("data-theme","dark"); icon.className="ph ph-sun"; }
    else { html.removeAttribute("data-theme"); icon.className="ph ph-moon"; }
  }
  applyTheme(localStorage.getItem("nova-theme")==="dark");
  btn.addEventListener("click", ()=>{
    const isDark = html.getAttribute("data-theme")==="dark";
    applyTheme(!isDark);
    localStorage.setItem("nova-theme", !isDark?"dark":"light");
    btn.classList.remove("shaking"); void btn.offsetWidth; btn.classList.add("shaking");
    setTimeout(()=>btn.classList.remove("shaking"),400);
  });
})();

/* ============ Offline ============ */
const updateOffline = ()=> $("#offline").classList.toggle("show", !navigator.onLine);
window.addEventListener("online", updateOffline);
window.addEventListener("offline", updateOffline);
updateOffline();

/* ============ Auth & Init ============ */
(async function init(){
  const { data } = await sb.auth.getSession();
  if(!data.session){ window.location.href="index.html"; return; }
  currentUser = data.session.user;

  await Promise.all([loadPartner(), loadMessages()]);

  // Hide loader
  $("#loader").classList.add("hide");
  setTimeout(()=>{ const l=$("#loader"); if(l) l.remove(); }, 400);

  // Realtime: new incoming messages
  sb.channel("chat-" + [currentUser.id, partnerId].sort().join("-"))
    .on("postgres_changes",{ event:"INSERT", schema:"public", table:"messages" }, async payload=>{
      const msg = payload.new;
      const isRelevant =
        (msg.sender_id === partnerId && msg.receiver_id === currentUser.id) ||
        (msg.sender_id === currentUser.id && msg.receiver_id === partnerId);
      if(!isRelevant) return;

      // Avoid duplicate if it was our own optimistic
      const exists = messages.find(m => m.id === msg.id);
      if(exists) return;

      messages.push(msg);
      renderMessages(false);

      // Animate only the new bubble
      const rows = $("#messagesArea").querySelectorAll(`.bubble-row.${msg.sender_id === currentUser.id ? "out" : "in"}`);
      const last = rows[rows.length - 1];
      if(last){ last.classList.add("animate"); }

      scrollToBottom(true);
      vibrate(30);

      if(msg.sender_id === partnerId){
        await markRead();
      }
    })
    .on("postgres_changes",{ event:"UPDATE", schema:"public", table:"messages" }, payload=>{
      const updated = payload.new;
      const idx = messages.findIndex(m => m.id === updated.id);
      if(idx > -1){
        messages[idx] = updated;
        // Update seen label without full re-render
        const seenLabel = $("#seenLabel");
        if(seenLabel && updated.is_read) seenLabel.classList.add("show");
      }
    })
    .subscribe();

  // Realtime: partner online status
  sb.channel("chat-partner-status-" + partnerId)
    .on("postgres_changes",{ event:"UPDATE", schema:"public", table:"profiles",
      filter:`id=eq.${partnerId}` }, payload=>{
      if(partner){
        partner.is_online = payload.new.is_online;
        partner.last_seen = payload.new.last_seen;
        updateStatus();
        const dot = $("#headerDot");
        if(dot) dot.classList.toggle("show", partner.is_online);
      }
    })
    .subscribe();
})();
</script>
