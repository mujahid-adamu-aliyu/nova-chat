<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#fb923c" />
<title>NovaChat — Chats</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23fb923c'/><path d='M16 26 Q24 18 32 22 Q40 26 48 18' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/><path d='M16 32 Q24 24 32 28 Q40 32 48 24' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' opacity='0.7'/><path d='M16 38 Q24 30 32 34 Q40 38 48 30' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' opacity='0.4'/></svg>" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
  :root{
    --bg: #ddeeff;
    --ink: #0b1b3a;
    --ink-soft:#5b6b8c;
    --muted:#9aa6c2;
    --line:#e3eaf6;
    --brand:#1d4ed8;
    --brand-2:#3b82f6;
    --brand-glow: rgba(29,78,216,.35);
    --bad:#ef4444;
    --radius-lg:22px;
    --transition: .25s cubic-bezier(.4,.0,.2,1);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:#fff;
    height: 100vh; overflow: hidden;
  }

  /* ---------- Offline banner ---------- */
  #offlineBanner{
    position:fixed; top:0; left:0; right:0; z-index:80;
    background:var(--bad); color:#fff; text-align:center;
    padding:10px 14px; font-size:14px; font-weight:600;
    transform:translateY(-100%); transition: transform .35s ease;
  }
  #offlineBanner.show{transform:translateY(0);}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; top: -120px; left:50%; transform: translateX(-50%);
    background:var(--ink); color:#fff;
    padding:12px 18px 12px 14px; border-radius:14px;
    font-size:14px; font-weight:600;
    box-shadow:0 18px 40px -12px rgba(0,0,0,.35);
    transition: top .35s cubic-bezier(.34,1.4,.64,1);
    z-index:9000; max-width: 90%;
    display: flex; align-items: center; gap: 8px;
  }
  .toast.show{ top: calc(18px + env(safe-area-inset-top, 0px));}
  .toast.bad{ background:var(--bad);}
  .toast-icon { font-size: 18px; flex-shrink: 0; }

  /* ---------- Placeholder page ---------- */
  .placeholder-page {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 140% 60% at 80% -5%,  #60a5fa 0%, transparent 55%),
      radial-gradient(ellipse 100% 50% at -10% 30%,  #3b82f6 0%, transparent 50%),
      radial-gradient(ellipse 120% 55% at 50% 110%,  #2563eb 0%, transparent 55%),
      radial-gradient(ellipse 80%  40% at 100% 80%,  #06b6d4 0%, transparent 45%),
      linear-gradient(165deg, #1d6ffc 0%, #1e54e8 30%, #1743c8 60%, #1232a8 100%);
    padding: 0 28px 100px;
    text-align: center;
  }
  .placeholder-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.18);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,.35);
    border-radius: 999px; padding: 6px 16px;
    font-size: 11px; font-weight: 700; letter-spacing: .6px;
    text-transform: uppercase; margin-bottom: 18px;
    backdrop-filter: blur(8px);
    box-shadow: 0 2px 12px rgba(0,0,0,.12);
  }
  .placeholder-page-title {
    font-size: 26px; font-weight: 800; color: #fff;
    margin: 0 0 10px; letter-spacing: -.4px;
    text-shadow: 0 2px 12px rgba(0,0,0,.18);
  }
  .placeholder-page-sub {
    font-size: 15px; color: rgba(255,255,255,.72); line-height: 1.6;
    max-width: 270px;
  }

  /* ---------- Bottom tab island (matches profile.html) ---------- */
  .tabbar{
    position:fixed;
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
    left:50%;
    transform:translateX(-50%);
    width:min(calc(100vw - 24px), 416px);
    height:62px;
    background:rgba(246,250,255,.93);
    backdrop-filter:blur(5px) saturate(130%);
    -webkit-backdrop-filter:blur(5px) saturate(130%);
    border:1px solid rgba(199,218,243,.8);
    border-radius:13px;
    box-shadow:0 24px 60px -17px rgba(15,40,120,.38);
    display:flex;align-items:center;justify-content:space-between;
    padding:5px 6px;z-index:80;
  }
  .tab-btn{
    position:relative;flex:1;height:100%;border-radius:9px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;color:var(--ink-soft);font-size:11px;font-weight:600;
    text-decoration:none;
    transition:color var(--transition);
    border:none;background:transparent;cursor:pointer;font-family:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  .tab-btn i{font-size:22px;transition:transform var(--transition);z-index:2;position:relative;}
  .tab-btn span{z-index:2;position:relative;}
  .tab-btn::before{
    content:"";position:absolute;inset:0;
    border-radius:9px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    box-shadow:0 8px 20px -8px var(--brand-glow);
    opacity:0;transform:scale(.85);
    transition:opacity .25s var(--transition), transform .35s cubic-bezier(.34,1.4,.64,1);
    z-index:1;
  }
  .tab-btn.active{color:#fff;}
  .tab-btn.active::before{opacity:1;transform:scale(1);}
  .tab-btn.active i{transform:scale(1.05);}
  .tab-btn .notif-dot{
    position:absolute;top:8px;right:calc(50% - 16px);
    width:9px;height:9px;border-radius:50%;
    background:var(--bad);border:2px solid rgba(246,250,255,.93);
    transform:scale(0);opacity:0;
    transition:transform .35s cubic-bezier(.34,1.4,.64,1), opacity .25s var(--transition);
    z-index:3;
  }
  .tab-btn .notif-dot.show{transform:scale(1);opacity:1;}

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div id="offlineBanner">⚠️ You are offline. Reconnecting…</div>

<div class="placeholder-page">
  <span class="placeholder-badge"><i class="ph ph-clock" style="font-size:13px;"></i> Coming Soon</span>
  <div class="placeholder-page-title">Chats</div>
  <div class="placeholder-page-sub">Your conversations will appear here. Stay tuned for the full messaging experience.</div>
</div>

<!-- BOTTOM TAB ISLAND -->
<nav class="tabbar">
  <a class="tab-btn active" href="chats.html"><i class="ph ph-chats-fill"></i><span>Chats</span></a>
  <a class="tab-btn" href="discover.html"><i class="ph ph-compass"></i><span>Discover</span></a>
  <a class="tab-btn" href="notifications.html"><i class="ph ph-bell"></i><span>Alerts</span><span class="notif-dot" id="notifDot"></span></a>
  <a class="tab-btn" href="profile.html"><i class="ph ph-user-circle"></i><span>Profile</span></a>
</nav>

<script>
const SUPABASE_URL = "https://akmwzymifytmuinbyeif.supabase.co";
const SUPABASE_KEY = "sb_publishable_QhVT2UQmI0_ZNg47vcs0eg_-jt4hP_A";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

(async () => {
  try {
    const { data } = await sb.auth.getSession();
    if (!data.session) window.location.href = "index.html";
  } catch(e) {
    window.location.href = "index.html";
  }
})();

window.addEventListener('offline', () => document.getElementById('offlineBanner').classList.add('show'));
window.addEventListener('online',  () => document.getElementById('offlineBanner').classList.remove('show'));
if (!navigator.onLine) document.getElementById('offlineBanner').classList.add('show');
</script>
</html>
