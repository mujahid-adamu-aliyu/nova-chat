<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1d4ed8" />
<title>NovaChat — Chats</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='30' r='26' fill='%231d4ed8'/><circle cx='22' cy='30' r='3.2' fill='white'/><circle cx='32' cy='30' r='3.2' fill='white'/><circle cx='42' cy='30' r='3.2' fill='white'/><path d='M26 52 L32 60 L38 52 Z' fill='%231d4ed8'/></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
/* ====== UNIFIED CSS VARIABLES (matches discover.html) ====== */
:root{
  --bg:#dde6f0;
  --bg-2:#d4e2f8;
  --card:#f0f6ff;
  --card-2:#f8faff;
  --ink:#0b1b3a;
  --ink-soft:#5b6b8c;
  --muted:#9aa6c2;
  --line:#e3eaf6;
  --surface:#c9dcf6;
  --surface-2:#bcd2f0;
  --surface-border:#a8c2e8;
  --brand:#1d4ed8;
  --brand-2:#3b82f6;
  --brand-3:#60a5fa;
  --brand-glow:rgba(29,78,216,.45);
  --hero:#1d4ed8;
  --hero-2:#2563eb;
  --good:#22c55e;
  --warn:#f59e0b;
  --bad:#ef4444;
  --radius:18px;
  --radius-lg:24px;
  --shadow-sm:0 8px 24px -6px rgba(15,40,120,.18);
  --shadow:0 18px 40px -18px rgba(15,40,90,.25);
  --shadow-lg:0 28px 70px -18px rgba(15,40,120,.35);
  --transition:.25s cubic-bezier(.4,.0,.2,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --glass-bg:rgba(255,255,255,0.55);
  --glass-border:rgba(255,255,255,0.80);

  /* ── Bubble colours (light) ── */
  --bubble-in-bg: linear-gradient(135deg, #2563eb, #1d4ed8);
  --bubble-in-text: #ffffff;
  --bubble-in-border: transparent;
  --bubble-out-bg: rgba(255,255,255,0.55);
  --bubble-out-text: var(--ink);
  --bubble-out-border: rgba(199,218,243,0.7);
}

/* ====== UNIFIED DARK THEME (matches discover.html) ====== */
[data-theme="dark"]{
  --bg:#0d1117;
  --bg-2:#0f1724;
  --card:#111827;
  --card-2:#1a2235;
  --ink:#ecf0f7;
  --ink-soft:#8ea0b9;
  --muted:#596d86;
  --line:#1e2d42;
  --surface:#0d1420;
  --surface-2:#182030;
  --surface-border:#273d56;
  --hero:#1e3a8a;
  --hero-2:#1d4ed8;
  --shadow-sm:0 8px 24px -6px rgba(0,0,0,.50);
  --shadow:0 18px 40px -18px rgba(0,0,0,.62);
  --shadow-lg:0 28px 70px -18px rgba(0,0,0,.72);

  /* ── Bubble colours (dark) ── */
  --bubble-in-bg: linear-gradient(135deg, #2563eb, #1d4ed8);
  --bubble-in-text: #ffffff;
  --bubble-in-border: transparent;
  --bubble-out-bg: rgba(255,255,255,0.06);
  --bubble-out-text: #ecf0f7;
  --bubble-out-border: rgba(39,61,86,0.55);
}
[data-theme="dark"] body{background:var(--bg);}
[data-theme="dark"] .topbar{background:#111827;border-color:#1e2d42;}
[data-theme="dark"] #themeToggle{background:#0d1420;border-color:#1e2d42;color:#ecf0f7;}
[data-theme="dark"] #refreshBtn{background:#0d1420;border-color:#1e2d42;color:#ecf0f7;}
[data-theme="dark"] .tabbar{background:#111827;border-color:#1e2d42;}
[data-theme="dark"] .tab-btn{color:#596d86;}
[data-theme="dark"] .tab-btn.active{color:#fff;}
[data-theme="dark"] .list-islands{background:var(--card);}
[data-theme="dark"] .chat-island + .chat-island .chat-row{border-color:#1e2d42;}
[data-theme="dark"] .chat-row:active{background:rgba(255,255,255,.04);}
[data-theme="dark"] .c-time{color:#596d86;}
[data-theme="dark"] .c-preview{color:#596d86;}
[data-theme="dark"] .empty-state{color:#596d86;}
[data-theme="dark"] .section-chip{background:#0d1420;border-color:#1e2d42;color:#8ea0b9;}
[data-theme="dark"] .menu-sheet{background:var(--card);}
[data-theme="dark"] .menu-item{color:#f1f5f9;}
[data-theme="dark"] .menu-item:active{background:rgba(255,255,255,.06);}
[data-theme="dark"] .menu-divider{background:#1e2d42;}
[data-theme="dark"] .topbar-name{color:#ecf0f7;}
[data-theme="dark"] .topbar-sub{color:#596d86;}
[data-theme="dark"] .notif-card{background:#1a2540;}
[data-theme="dark"] .notif-title{color:#ecf0f7;}
[data-theme="dark"] .notif-msg{color:#8ea0b9;}
[data-theme="dark"] .notif-icon-wrap{background:rgba(29,78,216,.2);}
[data-theme="dark"] .notif-card.good .notif-icon-wrap{background:rgba(34,197,94,.15);}
[data-theme="dark"] .notif-card.bad .notif-icon-wrap{background:rgba(239,68,68,.15);}

/* ====== RESET ====== */
body{-webkit-user-select:none;-moz-user-select:none;user-select:none;
  /* Disable pull-to-refresh */
  overscroll-behavior-y:none;
}
input,textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text;}
button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;}
a{text-decoration:none;}

body{
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--bg);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .35s ease, color .25s ease;
}
body::-webkit-scrollbar{display:none;}
body{scrollbar-width:none;}

/* ====== PAGE ====== */
.page{
  max-width:440px;
  margin:0 auto;
  min-height:100vh;
  padding:calc(76px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px));
}

/* ====== OFFLINE BANNER ====== */
.offline{
  position:fixed;top:0;left:0;right:0;
  background:var(--bad);color:#fff;
  text-align:center;padding:6px 10px;
  font-size:13px;font-weight:600;z-index:200;
  transform:translateY(-100%);transition:transform .3s;
}
.offline.show{transform:translateY(0);}

/* ====== TOPBAR — pill, matched to discover.html ====== */
.topbar{
  position:fixed;
  top:calc(12px + env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%);
  width:min(calc(100vw - 32px),416px);
  height:56px;z-index:80;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px 0 16px;
  border-radius:28px;
  background:var(--card);
  border:0.5px solid var(--line);
  box-shadow:0 8px 32px rgba(0,0,0,0.10);
  transition:background .3s, border-color .3s;
}

/* Left: avatar + name */
.topbar-profile{display:flex;align-items:center;gap:10px;}
.topbar-avatar{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#fff;
  flex-shrink:0;position:relative;
  box-shadow:0 3px 12px -3px rgba(0,0,60,.25);
  overflow:hidden;
  background:linear-gradient(135deg,#a8c4f0,#1d4ed8);
}
.topbar-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.topbar-text{display:flex;flex-direction:column;gap:0;}
.topbar-name{font-size:15px;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:-.2px;}
.topbar-sub{font-size:11px;font-weight:500;color:var(--muted);margin-top:1px;}

/* Right: action buttons */
.topbar-right{display:flex;align-items:center;gap:6px;}
.icon-btn{
  width:34px;height:34px;border-radius:14px;
  display:grid;place-items:center;
  color:var(--ink-soft);
  background:var(--surface);
  border:1.5px solid var(--line);
  box-shadow:0 2px 8px -2px rgba(29,78,216,.12);
  transition:background .25s,border-color .25s,color .25s,transform .15s;
  flex-shrink:0;
}
.icon-btn:active{transform:scale(.88);}
.icon-btn i{font-size:18px;}
#themeToggle{
  width:34px;height:34px;border-radius:14px;
  display:grid;place-items:center;
  color:var(--ink-soft);
  background:var(--surface);
  border:1.5px solid var(--line);
  box-shadow:0 2px 8px -2px rgba(29,78,216,.12);
  transition:background .25s,border-color .25s,color .25s,transform .15s;
  flex-shrink:0;
}
#themeToggle:active{transform:scale(.88);}
#themeToggle i{font-size:18px;transition:opacity .2s,transform .25s;}
@keyframes themeShake{
  0%{transform:rotate(0deg);}20%{transform:rotate(-18deg);}
  40%{transform:rotate(18deg);}60%{transform:rotate(-12deg);}
  80%{transform:rotate(10deg);}100%{transform:rotate(0deg);}
}
#themeToggle.shaking i{animation:themeShake .4s ease;}

/* Refresh button */
#refreshBtn{
  width:34px;height:34px;border-radius:14px;
  display:grid;place-items:center;
  color:var(--ink-soft);
  background:var(--surface);
  border:1.5px solid var(--line);
  box-shadow:0 2px 8px -2px rgba(29,78,216,.12);
  transition:background .25s,border-color .25s,color .25s,transform .15s;
  flex-shrink:0;
}
#refreshBtn:active{transform:scale(.88);}
#refreshBtn i{font-size:18px;transition:transform .5s cubic-bezier(.34,1.4,.64,1);}
#refreshBtn.spinning i{transform:rotate(360deg);}



/* ====== SECTION HEADER ====== */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 0 10px;
}
.section-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--ink-soft);
}
.section-chip i{font-size:13px;}
.chats-count{font-size:13px;font-weight:600;color:var(--muted);}

/* ====== CHAT LIST — flat with dividers ====== */
.list-islands{
  display:flex;flex-direction:column;
  opacity:0;transform:translateY(14px);
  animation:cardIn .55s var(--spring) forwards .1s;
  background:var(--card);
  border:0.5px solid var(--line);
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow);
}
@keyframes cardIn{to{opacity:1;transform:translateY(0);}}

.chat-island{
  background:transparent;
  border:none;
  border-radius:0;
  box-shadow:none;
}
.chat-island + .chat-island .chat-row{
  border-top:1px solid var(--line);
}

.chat-row{
  display:flex;align-items:center;gap:13px;
  padding:12px 16px;
  cursor:pointer;
  transition:background var(--transition);
  position:relative;
}
.chat-row:active{background:rgba(29,78,216,.06);}

/* Avatar */
.c-avatar{
  width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;
  font-weight:700;font-size:16px;color:#fff;
  flex-shrink:0;position:relative;
  box-shadow:0 4px 14px -4px rgba(0,0,60,.25);
}
.c-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
/* c-dot removed — online shown as text only */
.c-dot{ display:none !important; }

/* Info */
.c-info{flex:1;min-width:0;}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.c-name{font-size:15px;font-weight:700;color:var(--ink);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-online-text{
  font-size:10px;font-weight:600;color:var(--ink-soft);
  text-transform:lowercase;letter-spacing:.2px;
  vertical-align:middle;margin-left:4px;
}
.c-time{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.c-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px;}
.c-preview{
  font-size:12px;color:var(--ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;min-width:0;
}
.c-preview.unread{color:var(--ink);font-weight:600;}
.c-badge{
  min-width:20px;height:20px;border-radius:999px;
  background:var(--brand);color:#fff;
  font-size:11px;font-weight:700;
  display:grid;place-items:center;
  padding:0 5px;flex-shrink:0;
  transform:scale(0);opacity:0;
  transition:transform .3s var(--spring),opacity .2s ease;
}
.c-badge.show{transform:scale(1);opacity:1;}

/* ====== EMPTY STATE ====== */
.empty-state{
  text-align:center;padding:60px 24px;
  color:var(--ink-soft);
}
.empty-state i{font-size:52px;color:var(--muted);display:block;margin-bottom:12px;}
.empty-state p{font-size:14px;font-weight:500;margin:0 0 4px;}
.empty-state small{font-size:12px;color:var(--muted);}

/* ====== BOTTOM TAB ISLAND — pill, matched to discover.html ====== */
.tabbar{
  position:fixed;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  width:min(calc(100vw - 32px),416px);
  height:62px;
  background:var(--card);
  border:0.5px solid var(--line);
  border-radius:28px;
  box-shadow:0 8px 32px rgba(0,0,0,0.10);
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 8px;z-index:80;
  transition:background .3s, border-color .3s;
}
.tab-btn{
  position:relative;flex:1;height:100%;border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--ink-soft);font-size:11px;font-weight:600;
  text-decoration:none;
  transition:color var(--transition);
}
.tab-btn i{font-size:22px;transition:transform var(--transition);z-index:2;position:relative;}
.tab-btn span{z-index:2;position:relative;}
.tab-btn::before{
  content:"";position:absolute;inset:0;border-radius:20px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 8px 20px -8px var(--brand-glow);
  opacity:0;transform:scale(.85);
  transition:opacity .25s var(--transition),transform .35s var(--spring);
  z-index:1;
}
.tab-btn.active{color:#fff;}
.tab-btn.active::before{opacity:1;transform:scale(1);}
.tab-btn.active i{transform:scale(1.05);}
.tab-btn .notif-dot{
  position:absolute;top:8px;right:calc(50% - 16px);
  width:9px;height:9px;border-radius:50%;
  background:var(--bad);border:2px solid var(--card);
  transform:scale(0);opacity:0;
  transition:transform .35s var(--spring),opacity .25s var(--transition);
  z-index:3;
}
.tab-btn .notif-dot.show{transform:scale(1);opacity:1;}

/* ====== LOADER ====== */
.loader{
  position:fixed;inset:0;z-index:999;
  background:var(--bg);
  display:grid;place-items:center;
  transition:opacity .3s ease;
}
.loader.hide{opacity:0;pointer-events:none;}
.spin{
  width:36px;height:36px;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--brand);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ====== TOAST NOTIFICATION (matches discover.html) ====== */
.notif-popup{
  position:fixed;
  top:calc(76px + env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%) translateY(-20px);
  z-index:300;opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .4s var(--spring);
  width:min(calc(100vw - 32px),400px);
}
.notif-popup.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.notif-card{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px;border-radius:18px;background:var(--card);
  border-left:4px solid var(--brand);
  border:0.5px solid var(--line);
  border-left:4px solid var(--brand);
  box-shadow:0 20px 50px -12px rgba(15,40,120,.30),0 4px 16px -4px rgba(0,0,0,.12);
}
.notif-card.good{border-left-color:var(--good);}
.notif-card.bad{border-left-color:var(--bad);}
.notif-icon-wrap{width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:0 0 38px;}
.notif-card.good .notif-icon-wrap{background:#dcfce7;}
.notif-card.bad .notif-icon-wrap{background:#fee2e2;}
.notif-icon-wrap i{font-size:20px;color:var(--brand);}
.notif-card.good .notif-icon-wrap i{color:var(--good);}
.notif-card.bad .notif-icon-wrap i{color:var(--bad);}
.notif-body{flex:1;min-width:0;}
.notif-title{font-size:14px;font-weight:700;color:var(--ink);line-height:1.3;}
.notif-msg{font-size:13px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
.notif-close{color:var(--muted);font-size:18px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;flex:0 0 28px;}
.notif-close:active{background:var(--surface);}

/* ====== MENU SHEET ====== */
.menu-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(11,27,58,.0);
  backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);
  pointer-events:none;
  transition:background .3s ease,backdrop-filter .3s ease,-webkit-backdrop-filter .3s ease;
}
.menu-overlay.show{
  background:rgba(11,27,58,.4);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  pointer-events:auto;
}
.menu-sheet{
  position:fixed;bottom:0;left:50%;
  transform:translateX(-50%) translateY(100%);
  width:min(100vw,440px);
  border-radius:20px 20px 0 0;
  background:var(--card);
  box-shadow:0 -12px 40px -8px rgba(15,40,120,.25);
  z-index:101;
  padding:8px 0 calc(16px + env(safe-area-inset-bottom,0px));
  transition:transform .4s var(--spring);
}
.menu-sheet.show{transform:translateX(-50%) translateY(0);}
.menu-handle{width:36px;height:4px;border-radius:999px;background:rgba(0,0,0,.12);margin:6px auto 14px;}
[data-theme="dark"] .menu-handle{background:rgba(255,255,255,.12);}
.menu-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 20px;font-size:15px;font-weight:600;color:var(--ink);
  transition:background var(--transition);cursor:pointer;
}
.menu-item:active{background:rgba(29,78,216,.06);}
.menu-item i{font-size:20px;color:var(--ink-soft);}
.menu-item.danger{color:var(--bad);}
.menu-item.danger i{color:var(--bad);}
.menu-divider{height:1px;background:var(--line);margin:4px 0;}

/* ======================================================
   CHAT VIEW (inline — no page reload)
   ====================================================== */
.chat-view{
  position:fixed;inset:0;z-index:150;
  display:flex;flex-direction:column;
  max-width:440px;margin:0 auto;
  background:var(--bg);
  /* entrance: slide up + subtle scale, matching discover sheet animation */
  transform:translateY(100%) scale(.97);
  opacity:0;
  transition:transform .45s var(--spring), opacity .3s ease;
  pointer-events:none;
}
.chat-view.open{
  transform:translateY(0) scale(1);
  opacity:1;
  pointer-events:auto;
}

/* Match body bg inside chat view */
.chat-view::before{
  content:"";
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:var(--bg);
}

/* ── Chat Header — pill-shaped morphic glass ── */
.cv-header{
  position:relative;z-index:10;
  flex-shrink:0;
  display:flex;align-items:center;gap:10px;
  /* Floated pill — not flush edge to edge */
  margin:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;
  padding:10px 12px 10px 10px;
  border-radius:999px;
  /* Morphic glass — blurs content passing beneath */
  background:rgba(246,250,255,.72);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:
    0 8px 32px -8px rgba(15,40,120,.22),
    0 2px 8px -2px rgba(15,40,120,.10),
    inset 0 1px 0 rgba(255,255,255,.6);
}
[data-theme="dark"] .cv-header{
  background:rgba(18,28,50,.72);
  border-color:rgba(255,255,255,.08);
  box-shadow:
    0 8px 32px -8px rgba(0,0,0,.5),
    0 2px 8px -2px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.06);
}

.cv-back{
  width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;
  color:var(--ink-soft);flex-shrink:0;
  transition:transform var(--transition),background var(--transition);
  cursor:pointer;
}
.cv-back:active{transform:scale(.88);background:var(--surface);}
.cv-back i{font-size:22px;}

.cv-avatar{
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;
  font-weight:700;font-size:14px;color:#fff;
  flex-shrink:0;position:relative;
  box-shadow:0 3px 10px -3px rgba(0,0,60,.2);
  overflow:hidden;
}
.cv-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
/* cv-online-dot removed — online shown as text only */
.cv-online-dot{ display:none !important; }

.cv-info{flex:1;min-width:0;}
.cv-name{font-size:15px;font-weight:700;color:var(--ink);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cv-status{font-size:11px;font-weight:500;color:var(--muted);margin-top:1px;}
.cv-status.online{color:var(--ink);font-weight:600;}

.cv-actions{display:flex;gap:6px;flex-shrink:0;}
.cv-btn{
  width:36px;height:36px;border-radius:9px;
  display:grid;place-items:center;
  color:var(--ink-soft);
  background:rgba(219,231,251,.5);
  border:1px solid rgba(199,218,243,.5);
  transition:transform var(--transition),background var(--transition);
  cursor:pointer;
}
.cv-btn:active{transform:scale(.88);}
.cv-btn i{font-size:18px;}

/* ── Messages Area ── */
.cv-messages{
  position:relative;z-index:1;
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:8px 14px 12px;
  display:flex;flex-direction:column;gap:2px;
  scroll-behavior:smooth;
}
.cv-messages::-webkit-scrollbar{display:none;}
.cv-messages{scrollbar-width:none;}

/* Date chip */
.date-chip{
  align-self:center;
  font-size:11px;font-weight:600;
  color:var(--muted);
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(8px);
  border:1px solid rgba(199,218,243,.5);
  border-radius:999px;
  padding:4px 14px;
  margin:10px 0 6px;
  letter-spacing:.3px;
}
[data-theme="dark"] .date-chip{background:rgba(20,31,54,.85);color:#8ea0b9;border-color:#334155;}

/* ── Bubbles ── */
.bubble-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
  max-width:82%;
  margin-bottom:3px;
}
.bubble-row.out{
  align-self:flex-end;
  flex-direction:row-reverse;
}
.bubble-row.in{
  align-self:flex-start;
}
.bubble-row.group-start{ margin-top:10px; }

.bubble-mini-avatar{
  width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;
  font-size:9px;font-weight:700;color:#fff;
  flex-shrink:0;
  opacity:0;transition:opacity .2s;
  overflow:hidden;
  align-self:flex-end;
  margin-bottom:2px;
}
.bubble-mini-avatar.show{opacity:1;}
.bubble-mini-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}

.bubble{
  /* Tight WhatsApp-style padding */
  padding:6px 10px 4px;
  border-radius:8px;
  font-size:14px;
  font-weight:400;
  line-height:1.4;
  word-break:break-word;
  position:relative;
  max-width:100%;
  /* Inline timestamp trick: reserve trailing space for timestamp */
  display:block;
}

/* WhatsApp tail shapes */
.bubble-row.out .bubble{
  background:var(--bubble-out-bg);
  color:var(--bubble-out-text);
  border:1px solid var(--bubble-out-border);
  border-radius:8px 8px 2px 8px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 1px 4px rgba(15,40,120,.10);
}
.bubble-row.in .bubble{
  background:var(--bubble-in-bg);
  color:var(--bubble-in-text);
  border:none;
  border-radius:8px 8px 8px 2px;
  box-shadow:0 4px 14px -4px var(--brand-glow);
}

/* Timestamp — inline bottom-right, WhatsApp style */
.bubble-meta{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:3px;
  float:right;
  /* Pushes timestamp to bottom-right of bubble */
  margin-left:8px;
  margin-top:1px;
  margin-bottom:-1px;
}
.bubble-time{
  font-size:10px;
  font-weight:500;
  white-space:nowrap;
  color:rgba(255,255,255,.7);
  line-height:1;
}
.bubble-row.out .bubble-time{color:var(--ink-soft);opacity:.75;}

/* Seen receipt */
.seen-wrap{
  display:flex;justify-content:flex-end;
  padding-right:4px;
  margin-top:1px;
  margin-bottom:2px;
  min-height:12px;
}
.seen-label{
  font-size:10px;font-weight:600;
  color:var(--brand-3);
  opacity:0;transform:translateY(4px);
  transition:opacity .3s ease,transform .3s var(--spring);
}
.seen-label.show{opacity:1;transform:translateY(0);}

/* Image bubble */
.bubble-img{
  max-width:220px;max-height:260px;
  border-radius:14px;object-fit:cover;
  display:block;cursor:pointer;
  opacity:0;
  transition:opacity .4s ease, transform .3s var(--spring);
  transform:scale(.96);
}
.bubble-img.loaded{opacity:1;transform:scale(1);}
.bubble-img-wrap{padding:4px;border-radius:16px;overflow:hidden;}

/* Empty messages */
.empty-msgs{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:32px;
  gap:10px;color:var(--muted);
  animation:fadeIn .5s ease both .2s;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.empty-msgs i{font-size:48px;color:var(--surface-border);}
.empty-msgs p{font-size:14px;font-weight:600;margin:0;color:var(--ink-soft);}
.empty-msgs small{font-size:12px;}

/* ── Bubble entrance animations ── */
@keyframes bubbleInRight{
  from{opacity:0;transform:translateX(18px) scale(.92);}
  to{opacity:1;transform:translateX(0) scale(1);}
}
@keyframes bubbleInLeft{
  from{opacity:0;transform:translateX(-18px) scale(.92);}
  to{opacity:1;transform:translateX(0) scale(1);}
}
@keyframes bubbleInRightSpring{
  0%{opacity:0;transform:translateX(18px) scale(.88);}
  60%{transform:translateX(-4px) scale(1.03);}
  80%{transform:translateX(2px) scale(.99);}
  100%{opacity:1;transform:translateX(0) scale(1);}
}
.bubble-row.out.animate{animation:bubbleInRightSpring .42s var(--spring) both;}
.bubble-row.in.animate{animation:bubbleInLeft .38s var(--spring) both;}

/* ── Input Bar ── */
.cv-input-bar{
  position:relative;z-index:1;
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
  gap:8px;
  margin:0 12px;
  margin-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding:8px 10px;
  background:rgba(246,250,255,0.93);
  backdrop-filter:blur(12px) saturate(160%);
  -webkit-backdrop-filter:blur(12px) saturate(160%);
  border:1px solid rgba(199,218,243,0.7);
  border-radius:18px;
  box-shadow:0 24px 60px -17px rgba(15,40,120,.38);
  transition:border-color .25s;
}
.cv-input-bar.recording-active{
  border-color:rgba(239,68,68,.5);
  box-shadow:0 0 0 3px rgba(239,68,68,.12), 0 24px 60px -17px rgba(15,40,120,.38);
}

/* Image attach button — always visible */
.cv-attach{
  width:36px;height:36px;
  border-radius:9px;
  background:rgba(219,231,251,0.6);
  border:1px solid rgba(199,218,243,0.6);
  display:grid;place-items:center;
  color:var(--ink-soft);
  flex-shrink:0;
  transition:transform var(--transition),background var(--transition),opacity var(--transition);
  cursor:pointer;
}
.cv-attach:active{transform:scale(.90);}
.cv-attach i{font-size:20px;}
[data-theme="dark"] .cv-attach{background:rgba(20,31,54,.92);border-color:#334155;color:#94a3b8;}
[data-theme="dark"] .cv-input-bar{
  background:rgba(18,28,50,.95);
  border-color:#28384d;
}

/* Text input — transparent inside bar */
.cv-input{
  flex:1;
  min-height:36px;max-height:130px;
  border-radius:0;
  background:transparent;
  border:none;
  padding:0 4px;
  font-family:'Poppins',sans-serif;
  font-size:14px;font-weight:500;
  color:var(--ink);
  outline:none;
  resize:none;
  overflow-y:auto;
  line-height:1.45;
  scrollbar-width:none;
  align-self:center;
}
.cv-input::-webkit-scrollbar{display:none;}
.cv-input::placeholder{color:var(--muted);}
[data-theme="dark"] .cv-input{color:#f1f5f9;}
[data-theme="dark"] .cv-input::placeholder{color:#64748b;}

/* Right-side button group */
.cv-right-btns{
  display:flex;align-items:center;
  flex-shrink:0;
  position:relative;
  width:36px;height:36px;
}

/* Send button */
.cv-send{
  position:absolute;top:0;left:0;
  width:36px;height:36px;
  border-radius:9px;
  background:var(--brand);
  display:grid;place-items:center;
  color:#fff;
  flex-shrink:0;
  border:none;cursor:pointer;
  transition:transform .2s var(--spring),opacity .18s ease;
  opacity:0;transform:scale(.6) rotate(-15deg);pointer-events:none;
}
.cv-send.show{opacity:1;transform:scale(1) rotate(0deg);pointer-events:auto;}
.cv-send:active{transform:scale(.88);}
.cv-send i{font-size:20px;}

/* Mic button */
.cv-mic{
  position:absolute;top:0;left:0;
  width:36px;height:36px;
  border-radius:9px;
  background:rgba(219,231,251,0.6);
  border:1px solid rgba(199,218,243,0.6);
  display:grid;place-items:center;
  color:var(--ink-soft);
  cursor:pointer;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  transition:transform .2s var(--spring),background .2s ease,color .2s ease,opacity .18s ease,border-color .2s ease,box-shadow .2s ease;
  opacity:1;
}
.cv-mic i{font-size:20px;pointer-events:none;}
.cv-mic.recording{
  background:var(--bad);
  border-color:var(--bad);
  color:#fff;
  transform:scale(1.18);
  box-shadow:0 0 0 6px rgba(239,68,68,.2);
}
[data-theme="dark"] .cv-mic{background:rgba(20,31,54,.92);border-color:#334155;color:#94a3b8;}

/* Hidden file input */
#cvFileInput{display:none;}

/* ── Voice Recording Overlay (while holding) ── */
.cv-voice-overlay{
  position:absolute;
  bottom:0;left:0;right:0;
  height:64px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px 0 14px;
  border-radius:18px;
  background:rgba(246,250,255,0.97);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(199,218,243,0.7);
  box-shadow:0 24px 60px -17px rgba(15,40,120,.38);
  pointer-events:none;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .2s ease,transform .2s var(--spring);
  z-index:10;
  overflow:hidden;
}
[data-theme="dark"] .cv-voice-overlay{
  background:rgba(18,28,50,.97);
  border-color:#28384d;
}
.cv-voice-overlay.show{
  opacity:1;transform:translateY(0);pointer-events:auto;
}
/* Cancel hint slides in from left */
.cv-voice-cancel-hint{
  display:flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;
  color:var(--ink-soft);
  white-space:nowrap;
  transition:transform .25s ease,opacity .25s ease;
}
.cv-voice-cancel-hint i{font-size:16px;}
/* when dragging left, hint turns red */
.cv-voice-overlay.cancel-zone .cv-voice-cancel-hint{color:var(--bad);}

/* Waveform area */
.cv-voice-wave{
  flex:1;
  display:flex;align-items:center;
  justify-content:center;
  gap:3px;
  padding:0 8px;
  height:36px;
  overflow:hidden;
}
.cv-voice-wave .bar{
  width:3px;border-radius:99px;
  background:var(--brand);
  min-height:4px;
  animation:waveBar .6s ease-in-out infinite alternate;
}
.cv-voice-wave .bar:nth-child(2){animation-delay:.08s;}
.cv-voice-wave .bar:nth-child(3){animation-delay:.16s;}
.cv-voice-wave .bar:nth-child(4){animation-delay:.24s;}
.cv-voice-wave .bar:nth-child(5){animation-delay:.32s;}
.cv-voice-wave .bar:nth-child(6){animation-delay:.40s;}
.cv-voice-wave .bar:nth-child(7){animation-delay:.48s;}
.cv-voice-wave .bar:nth-child(8){animation-delay:.56s;}
.cv-voice-wave .bar:nth-child(9){animation-delay:.64s;}
.cv-voice-wave .bar:nth-child(10){animation-delay:.72s;}
.cv-voice-wave .bar:nth-child(11){animation-delay:.80s;}
.cv-voice-wave .bar:nth-child(12){animation-delay:.88s;}
@keyframes waveBar{
  from{height:4px;opacity:.5;}
  to{height:28px;opacity:1;}
}

/* Timer */
.cv-voice-timer{
  display:flex;align-items:center;gap:6px;
  font-size:14px;font-weight:700;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  flex-shrink:0;
}
.cv-voice-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--bad);
  animation:recDot .9s ease-in-out infinite;
}
@keyframes recDot{0%,100%{opacity:1;}50%{opacity:.2;}}

/* Up-lock hint */
.cv-voice-lock-hint{
  position:absolute;
  right:10px;bottom:calc(100% + 8px);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:11px;font-weight:600;color:var(--ink-soft);
  opacity:0;transform:translateY(10px);
  transition:opacity .25s,transform .25s var(--spring);
  pointer-events:none;
  background:rgba(246,250,255,.92);
  backdrop-filter:blur(10px);
  border:1px solid rgba(199,218,243,.7);
  border-radius:12px;
  padding:8px 10px;
}
[data-theme="dark"] .cv-voice-lock-hint{background:rgba(18,28,50,.92);border-color:#28384d;}
.cv-voice-lock-hint.show{opacity:1;transform:translateY(0);}
.cv-voice-lock-hint i{font-size:20px;color:var(--brand);}

/* ── Voice Preview Bar ── */
.cv-voice-preview{
  position:absolute;
  bottom:0;left:0;right:0;
  min-height:64px;
  display:flex;align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:18px;
  background:rgba(246,250,255,0.97);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(199,218,243,0.7);
  box-shadow:0 24px 60px -17px rgba(15,40,120,.38);
  pointer-events:none;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .22s ease,transform .22s var(--spring);
  z-index:11;
}
[data-theme="dark"] .cv-voice-preview{
  background:rgba(18,28,50,.97);
  border-color:#28384d;
}
.cv-voice-preview.show{
  opacity:1;transform:translateY(0);pointer-events:auto;
}

/* Discard btn */
.cv-preview-discard{
  width:36px;height:36px;border-radius:50%;
  background:rgba(239,68,68,.12);
  border:1.5px solid rgba(239,68,68,.3);
  display:grid;place-items:center;
  color:var(--bad);flex-shrink:0;
  cursor:pointer;
  transition:transform .15s,background .15s;
}
.cv-preview-discard:active{transform:scale(.88);background:rgba(239,68,68,.22);}
.cv-preview-discard i{font-size:18px;}

/* Mini audio player in preview */
.cv-preview-player{
  flex:1;display:flex;align-items:center;gap:8px;min-width:0;
}
.cv-preview-play{
  width:32px;height:32px;border-radius:50%;
  background:var(--brand);
  display:grid;place-items:center;
  color:#fff;flex-shrink:0;
  cursor:pointer;
  transition:transform .15s;
}
.cv-preview-play:active{transform:scale(.88);}
.cv-preview-play i{font-size:16px;}
.cv-preview-scrubber{
  flex:1;
  -webkit-appearance:none;appearance:none;
  height:3px;border-radius:99px;
  background:var(--line);
  outline:none;cursor:pointer;
}
.cv-preview-scrubber::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:12px;height:12px;border-radius:50%;
  background:var(--brand);cursor:pointer;
}
.cv-preview-time{
  font-size:11px;font-weight:600;color:var(--ink-soft);
  white-space:nowrap;flex-shrink:0;
  font-variant-numeric:tabular-nums;
}

/* Send voice btn in preview */
.cv-preview-send{
  width:36px;height:36px;border-radius:9px;
  background:var(--brand);
  display:grid;place-items:center;
  color:#fff;flex-shrink:0;
  cursor:pointer;
  transition:transform .15s;
}
.cv-preview-send:active{transform:scale(.88);}
.cv-preview-send i{font-size:20px;}

/* ── Voice bubble (in chat) ── */
.voice-bubble{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px 4px;
  min-width:190px;
}
.voice-play-btn{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  flex-shrink:0;cursor:pointer;
  transition:transform .15s,opacity .15s;
}
.bubble-row.in .voice-play-btn{
  background:rgba(255,255,255,.25);
  color:#fff;
}
.bubble-row.out .voice-play-btn{
  background:var(--brand);
  color:#fff;
}
.voice-play-btn:active{transform:scale(.88);}
.voice-play-btn i{font-size:18px;}
.voice-waveform{
  flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;
}
.voice-scrubber{
  -webkit-appearance:none;appearance:none;
  width:100%;height:3px;border-radius:99px;
  background:rgba(255,255,255,.3);
  outline:none;cursor:pointer;
}
.bubble-row.out .voice-scrubber{background:rgba(29,78,216,.3);}
.voice-scrubber::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:10px;height:10px;border-radius:50%;
  background:#fff;cursor:pointer;
}
.bubble-row.out .voice-scrubber::-webkit-slider-thumb{background:var(--brand);}
.voice-duration{
  font-size:10px;font-weight:600;
  opacity:.75;line-height:1;
  font-variant-numeric:tabular-nums;
}
.bubble-row.in .voice-duration{color:#fff;}
.bubble-row.out .voice-duration{color:var(--ink-soft);}

/* ── Fullscreen image overlay ── */
.img-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.92);
  display:grid;place-items:center;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease;
}
.img-overlay.show{opacity:1;pointer-events:auto;}
.img-overlay img{
  max-width:calc(100vw - 32px);
  max-height:calc(100dvh - 80px);
  border-radius:16px;object-fit:contain;
  transform:scale(.9);
  transition:transform .35s var(--spring);
  box-shadow:0 24px 60px -12px rgba(0,0,0,.6);
}
.img-overlay.show img{transform:scale(1);}
.img-overlay-close{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  display:grid;place-items:center;
  color:#fff;font-size:22px;
  transition:background var(--transition),transform var(--transition);
  cursor:pointer;
}
.img-overlay-close:active{background:rgba(255,255,255,.25);transform:scale(.9);}
</style>
</head>
<body>

<div class="offline" id="offline">You're offline — check your connection</div>
<div class="loader" id="loader"><div class="spin"></div></div>

<!-- ============================================================
     CHATS LIST VIEW
     ============================================================ -->

<!-- TOPBAR — profile-aware -->
<header class="topbar">
  <div class="topbar-profile">
    <div class="topbar-avatar" id="topbarAvatar">
      <span id="topbarInitials">?</span>
    </div>
    <div class="topbar-text">
      <span class="topbar-name" id="topbarName">NovaChat</span>
      <span class="topbar-sub" id="topbarSub">My account</span>
    </div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="composeBtn" title="New chat">
      <i class="ph ph-pencil-simple"></i>
    </button>
    <button id="refreshBtn" title="Refresh chats" aria-label="Refresh chats">
      <i class="ph ph-arrows-clockwise"></i>
    </button>
    <button id="themeToggle" title="Toggle theme">
      <i class="ph ph-moon" id="themeIcon"></i>
    </button>
  </div>
</header>

<!-- PAGE -->
<main class="page">
  <!-- SECTION HEADER -->
  <div class="section-header">
    <div class="section-chip"><i class="ph ph-chat-circle-dots"></i> All Chats</div>
    <span class="chats-count" id="chatsCount"></span>
  </div>

  <!-- CHAT LIST -->
  <div class="list-islands" id="chatList"></div>
</main>

<!-- BOTTOM TABBAR — 3 tabs, matches discover.html -->
<nav class="tabbar">
  <a class="tab-btn active" href="chats.html"><i class="ph ph-chats"></i><span>Chats</span><span class="notif-dot" id="chatDot"></span></a>
  <a class="tab-btn" href="discover.html"><i class="ph ph-compass"></i><span>Discover</span></a>
  <a class="tab-btn" href="profile.html"><i class="ph ph-user-circle"></i><span>Profile</span></a>
</nav>

<!-- TOAST NOTIFICATION (matches discover.html) -->
<div class="notif-popup" id="notifPopup">
  <div class="notif-card" id="notifCard">
    <div class="notif-icon-wrap"><i class="ph ph-info" id="notifIcon"></i></div>
    <div class="notif-body">
      <div class="notif-title" id="notifTitle">Notice</div>
      <div class="notif-msg" id="notifMsg"></div>
    </div>
    <button class="notif-close" id="notifClose"><i class="ph ph-x"></i></button>
  </div>
</div>

<!-- THREE-DOT MENU SHEET -->
<div class="menu-overlay" id="menuOverlay"></div>
<div class="menu-sheet" id="menuSheet">
  <div class="menu-handle"></div>

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
function vibrate(ms){ navigator.vibrate && navigator.vibrate(ms); }

function initialsOf(name){
  if(!name) return "?";
  return name.trim().split(/\s+/).slice(0,2).map(s=>s[0].toUpperCase()).join("");
}

const AVATAR_COLORS = [
  ["#a8c4f0","#1d4ed8"],["#c4b5fd","#7c3aed"],["#86efac","#16a34a"],
  ["#fca5a5","#dc2626"],["#fde68a","#d97706"],["#a5f3fc","#0891b2"],
  ["#f9a8d4","#db2777"],["#bfdbfe","#2563eb"],
];
function avatarColor(str){
  let hash=0;
  for(let c of (str||"")) hash=(hash*31+c.charCodeAt(0))&0xffffffff;
  return AVATAR_COLORS[Math.abs(hash)%AVATAR_COLORS.length];
}

function fmtTime(ts){
  if(!ts) return "";
  const d=new Date(ts);
  const now=new Date();
  const diff=(now-d)/1000;
  if(diff<60) return "now";
  if(diff<3600){
    const h=d.getHours(),m=d.getMinutes();
    const ampm=h>=12?"pm":"am";
    return `${h%12||12}:${String(m).padStart(2,"0")} ${ampm}`;
  }
  const today=new Date(); today.setHours(0,0,0,0);
  const msgDay=new Date(d); msgDay.setHours(0,0,0,0);
  const dayDiff=Math.round((today-msgDay)/86400000);
  if(dayDiff===0){
    const h=d.getHours(),m=d.getMinutes();
    const ampm=h>=12?"pm":"am";
    return `${h%12||12}:${String(m).padStart(2,"0")} ${ampm}`;
  }
  if(dayDiff===1) return "Yesterday";
  if(dayDiff<7) return d.toLocaleDateString("en",{weekday:"short"});
  return d.toLocaleDateString("en",{month:"short",day:"numeric"});
}

function fmtDateChip(ts){
  const d=new Date(ts);
  const today=new Date(); today.setHours(0,0,0,0);
  const msgDay=new Date(d); msgDay.setHours(0,0,0,0);
  const diff=Math.round((today-msgDay)/86400000);
  if(diff===0) return "Today";
  if(diff===1) return "Yesterday";
  if(diff<7) return d.toLocaleDateString("en",{weekday:"long"});
  return d.toLocaleDateString("en",{month:"long",day:"numeric",year:"numeric"});
}

function sameDay(a,b){
  const da=new Date(a),db=new Date(b);
  return da.getFullYear()===db.getFullYear()&&da.getMonth()===db.getMonth()&&da.getDate()===db.getDate();
}

function previewText(msg){
  if(!msg) return "";
  if(msg.type==="image") return "📷 Photo";
  if(msg.type==="voice") return "🎤 Voice message";
  return msg.content||"";
}

function escHtml(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}

function fmtLastSeen(ts){
  const d=new Date(ts),now=new Date();
  const diff=(now-d)/1000;
  if(diff<3600) return `${Math.floor(diff/60)}m ago`;
  if(diff<86400) return `${Math.floor(diff/3600)}h ago`;
  if(diff<172800) return "yesterday";
  return d.toLocaleDateString("en",{month:"short",day:"numeric"});
}

/* ============ Global State ============ */
let currentUser = null;
let myProfile   = null;
let conversations = [];
let searchQ = "";

/* ========================================================
   CHATS LIST
   ======================================================== */
function renderList(){
  const list = searchQ
    ? conversations.filter(c=>{
        const q=searchQ.toLowerCase();
        const name=(c.partner.full_name||"").toLowerCase();
        const uname=(c.partner.username||"").toLowerCase();
        const preview=previewText(c.lastMsg).toLowerCase();
        return name.includes(q)||uname.includes(q)||preview.includes(q);
      })
    : conversations;

  const el=$("#chatList");
  const countEl=$("#chatsCount");
  if(countEl) countEl.textContent=list.length+(list.length===1?" chat":" chats");

  const totalUnread=conversations.reduce((sum,c)=>sum+c.unread,0);
  $("#chatDot").classList.toggle("show",totalUnread>0);

  if(list.length===0){
    el.innerHTML=`
      <div class="empty-state">
        <i class="ph ph-chat-circle-slash"></i>
        <p>${searchQ?"No results found":"No conversations yet"}</p>
        <small>${searchQ?"Try a different name":"Go to Discover and start chatting!"}</small>
      </div>`;
    return;
  }

  el.innerHTML=list.map(c=>{
    const p=c.partner;
    const [bg,fg]=avatarColor(p.id);
    const initials=initialsOf(p.full_name||p.username);
    const preview=previewText(c.lastMsg);
    const time=fmtTime(c.lastMsg?.created_at);
    const hasUnread=c.unread>0;

    const avatarInner=p.avatar_url
      ?`<img src="${p.avatar_url}" alt="${initials}" loading="lazy" />`
      :initials;

    return `
      <div class="chat-island" onclick="openChat('${p.id}')">
        <div class="chat-row">
          <div class="c-avatar" style="background:linear-gradient(135deg,${bg},${fg})">
            ${avatarInner}
          </div>
          <div class="c-info">
            <div class="c-top">
              <span class="c-name">${p.full_name||p.username||"Unknown"}${p.is_online?` <span class="c-online-text">online</span>`:""}</span>
              <span class="c-time">${time}</span>
            </div>
            <div class="c-bottom">
              <span class="c-preview${hasUnread?" unread":""}">${preview}</span>
              <span class="c-badge${hasUnread?" show":""}">${c.unread>99?"99+":c.unread}</span>
            </div>
          </div>
        </div>
      </div>`;
  }).join("");
}

async function loadConversations(){
  const {data:msgs,error}=await sb
    .from("messages")
    .select("id,sender_id,receiver_id,content,type,is_read,created_at")
    .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
    .order("created_at",{ascending:false});
  if(error){console.error(error);return;}

  const convMap=new Map();
  for(const msg of (msgs||[])){
    const partnerId=msg.sender_id===currentUser.id?msg.receiver_id:msg.sender_id;
    if(!convMap.has(partnerId)) convMap.set(partnerId,{lastMsg:msg,unread:0});
    if(msg.receiver_id===currentUser.id&&!msg.is_read) convMap.get(partnerId).unread++;
  }

  if(convMap.size===0){conversations=[];renderList();return;}

  const partnerIds=[...convMap.keys()];
  const {data:profiles}=await sb
    .from("profiles")
    .select("id,full_name,username,avatar_url,is_online")
    .in("id",partnerIds);

  const profileMap=new Map((profiles||[]).map(p=>[p.id,p]));

  conversations=partnerIds
    .map(id=>({
      partner:profileMap.get(id)||{id,full_name:"Unknown"},
      lastMsg:convMap.get(id).lastMsg,
      unread:convMap.get(id).unread,
    }))
    .sort((a,b)=>new Date(b.lastMsg.created_at)-new Date(a.lastMsg.created_at));

  renderList();
}

   INLINE CHAT VIEW
   ======================================================== */
let cvPartnerId=null;
let cvPartner=null;
let cvMessages=[];
let cvChannel=null;
let cvStatusChannel=null;

function openChat(userId){
  vibrate(30);
  cvPartnerId=userId;
  cvMessages=[];
  cvPartner=null;

  // Reset UI
  $("#cvMessages").innerHTML="";
  $("#cvName").textContent="…";
  $("#cvStatus").textContent="Loading…";
  $("#cvStatus").className="cv-status";
  const av=$("#cvAvatar");
  av.style.background="linear-gradient(135deg,#a8c4f0,#1d4ed8)";
  av.innerHTML="";
  $("#cvInput").value="";
  toggleCvSend();

  // Slide in
  const view=$("#chatView");
  view.classList.add("open");
  document.body.style.overflow="hidden";

  // Load partner + messages
  loadCvPartner();
  loadCvMessages();

  // Realtime channel for this conversation
  if(cvChannel) sb.removeChannel(cvChannel);
  cvChannel=sb.channel("cv-"+[currentUser.id,userId].sort().join("-"))
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async payload=>{
      const msg=payload.new;
      const isRelevant=
        (msg.sender_id===cvPartnerId&&msg.receiver_id===currentUser.id)||
        (msg.sender_id===currentUser.id&&msg.receiver_id===cvPartnerId);
      if(!isRelevant) return;
      const exists=cvMessages.find(m=>m.id===msg.id);
      if(exists) return;
      cvMessages.push(msg);
      renderCvMessages(false);
      const rows=$("#cvMessages").querySelectorAll(`.bubble-row.${msg.sender_id===currentUser.id?"out":"in"}`);
      const last=rows[rows.length-1];
      if(last) last.classList.add("animate");
      cvScrollToBottom(true);
      vibrate(30);
      if(msg.sender_id===cvPartnerId) await cvMarkRead();
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"},payload=>{
      const updated=payload.new;
      const idx=cvMessages.findIndex(m=>m.id===updated.id);
      if(idx>-1){
        cvMessages[idx]=updated;
        const sl=$("#cvSeenLabel");
        if(sl&&updated.is_read) sl.classList.add("show");
      }
    })
    .subscribe();

  // Realtime: partner online status
  if(cvStatusChannel) sb.removeChannel(cvStatusChannel);
  cvStatusChannel=sb.channel("cv-status-"+userId)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"profiles",filter:`id=eq.${userId}`},payload=>{
      if(cvPartner){
        cvPartner.is_online=payload.new.is_online;
        cvPartner.last_seen=payload.new.last_seen;
        updateCvStatus();
      }
    })
    .subscribe();
}

function closeChat(){
  vibrate(20);
  const view=$("#chatView");
  view.classList.remove("open");
  document.body.style.overflow="";
  if(cvChannel){sb.removeChannel(cvChannel);cvChannel=null;}
  if(cvStatusChannel){sb.removeChannel(cvStatusChannel);cvStatusChannel=null;}
  // refresh conversation list
  loadConversations();
}

function renderCvMessages(animate=false){
  const area=$("#cvMessages");
  if(cvMessages.length===0){
    area.innerHTML=`
      <div class="empty-msgs">
        <i class="ph ph-chat-circle-dots"></i>
        <p>No messages yet</p>
        <small>Say hello! 👋</small>
      </div>`;
    return;
  }

  const [bg,fg]=avatarColor(cvPartnerId);
  const initials=cvPartner?initialsOf(cvPartner.full_name||cvPartner.username):"?";
  const partnerAvatar=cvPartner?.avatar_url
    ?`<img src="${cvPartner.avatar_url}" alt="${initials}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`
    :initials;

  // My avatar for outgoing bubbles
  const myInitials=myProfile?initialsOf(myProfile.full_name||myProfile.username):"Me";
  const [myBg,myFg]=myProfile?avatarColor(myProfile.id):["#a8c4f0","#1d4ed8"];
  const myAvatar=myProfile?.avatar_url
    ?`<img src="${myProfile.avatar_url}" alt="${myInitials}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`
    :myInitials;

  let html="";
  let lastDate=null;
  let lastSenderId=null;

  cvMessages.forEach((msg,i)=>{
    const isOut=msg.sender_id===currentUser.id;
    const isNewDay=!lastDate||!sameDay(lastDate,msg.created_at);
    const isFirstInGroup=msg.sender_id!==lastSenderId;
    const animClass=animate?" animate":"";
    const groupClass=isFirstInGroup?" group-start":"";

    if(isNewDay){
      html+=`<div class="date-chip">${fmtDateChip(msg.created_at)}</div>`;
      lastDate=msg.created_at;
    }

    const showAvatar=isFirstInGroup;
    const avatarHtml=isOut
      ?`<div class="bubble-mini-avatar${showAvatar?" show":""}" style="background:linear-gradient(135deg,${myBg},${myFg})">${showAvatar?myAvatar:""}</div>`
      :`<div class="bubble-mini-avatar${showAvatar?" show":""}" style="background:linear-gradient(135deg,${bg},${fg})">${showAvatar?partnerAvatar:""}</div>`;

    let bubbleContent="";
    if(msg.type==="image"&&msg.media_url){
      bubbleContent=`
        <div class="bubble-img-wrap">
          <img class="bubble-img" src="${msg.media_url}" alt="Photo"
            onload="this.classList.add('loaded')"
            onclick="cvOpenImg('${msg.media_url}')" />
        </div>
        <div class="bubble-meta"><span class="bubble-time">${fmtTime(msg.created_at)}</span></div>`;
    } else if(msg.type==="voice"&&msg.media_url){
      const vid="vp-"+msg.id.replace(/[^a-z0-9]/gi,"");
      bubbleContent=`
        <div class="voice-bubble" id="${vid}">
          <button class="voice-play-btn" onclick="voiceBubbleToggle('${msg.media_url}','${vid}',this)">
            <i class="ph ph-play"></i>
          </button>
          <div class="voice-waveform">
            <input type="range" class="voice-scrubber" min="0" max="100" value="0"
              oninput="voiceBubbleScrub('${vid}',this.value)" />
            <span class="voice-duration" id="${vid}-dur">🎤 Voice</span>
          </div>
        </div>
        <div class="bubble-meta"><span class="bubble-time">${fmtTime(msg.created_at)}</span></div>`;
    } else {
      bubbleContent=`
        ${escHtml(msg.content||"")}
        <div class="bubble-meta"><span class="bubble-time">${fmtTime(msg.created_at)}</span></div>`;
    }

    html+=`
      <div class="bubble-row ${isOut?"out":"in"}${animClass}${groupClass}" data-id="${msg.id}" style="animation-delay:${animate?i*18:0}ms">
        ${avatarHtml}
        <div class="bubble">
          ${bubbleContent}
        </div>
      </div>`;

    if(isOut&&i===cvMessages.length-1){
      const isRead=msg.is_read;
      html+=`<div class="seen-wrap"><span class="seen-label${isRead?" show":""}" id="cvSeenLabel">Seen</span></div>`;
    }

    lastSenderId=msg.sender_id;
  });

  area.innerHTML=html;
  cvScrollToBottom();
}

function cvScrollToBottom(smooth=false){
  const area=$("#cvMessages");
  area.scrollTo({top:area.scrollHeight,behavior:smooth?"smooth":"instant"});
}

/* ── Send message ── */
async function cvSendMessage(){
  const input=$("#cvInput");
  const text=input.value.trim();
  if(!text) return;

  input.value="";
  input.style.height="auto";
  input.blur();
  toggleCvSend();
  vibrate(25);

  const tempMsg={
    id:"temp-"+Date.now(),
    sender_id:currentUser.id,
    receiver_id:cvPartnerId,
    content:text,type:"text",
    media_url:null,is_read:false,
    created_at:new Date().toISOString(),
  };
  cvMessages.push(tempMsg);
  renderCvMessages(false);

  const rows=$("#cvMessages").querySelectorAll(".bubble-row.out");
  const last=rows[rows.length-1];
  if(last) last.classList.add("animate");
  cvScrollToBottom(true);

  const {data,error}=await sb.from("messages").insert({
    sender_id:currentUser.id,
    receiver_id:cvPartnerId,
    content:text,type:"text",
  }).select().single();

  if(error){cvMessages=cvMessages.filter(m=>m.id!==tempMsg.id);renderCvMessages(false);return;}
  const idx=cvMessages.findIndex(m=>m.id===tempMsg.id);
  if(idx>-1) cvMessages[idx]=data;
}

async function cvSendImage(file){

  vibrate(20);

  const ext=file.name.split(".").pop()||"jpg";
  const path=`chat-images/${currentUser.id}/${Date.now()}.${ext}`;
  const localUrl=URL.createObjectURL(file);

  const tempMsg={
    id:"temp-img-"+Date.now(),
    sender_id:currentUser.id,receiver_id:cvPartnerId,
    content:null,type:"image",media_url:localUrl,
    is_read:false,created_at:new Date().toISOString(),
  };
  cvMessages.push(tempMsg);
  renderCvMessages(false);
  cvScrollToBottom(true);

  const rows=$("#cvMessages").querySelectorAll(".bubble-row.out");
  const last=rows[rows.length-1];
  if(last) last.classList.add("animate");

  const {error:upErr}=await sb.storage.from("chat-images").upload(path,file,{cacheControl:"3600",upsert:false});
  if(upErr){cvMessages=cvMessages.filter(m=>m.id!==tempMsg.id);renderCvMessages(false);return;}

  const {data:urlData}=sb.storage.from("chat-images").getPublicUrl(path);
  const {data,error}=await sb.from("messages").insert({
    sender_id:currentUser.id,receiver_id:cvPartnerId,
    content:null,type:"image",media_url:urlData.publicUrl,
  }).select().single();

  if(error){cvMessages=cvMessages.filter(m=>m.id!==tempMsg.id);renderCvMessages(false);return;}
  const idx=cvMessages.findIndex(m=>m.id===tempMsg.id);
  if(idx>-1) cvMessages[idx]=data;
  URL.revokeObjectURL(localUrl);
}

/* ══════════════════════════════════════════════════
   VOICE RECORDING ENGINE
   ══════════════════════════════════════════════════ */
let _voiceRecorder=null;
let _voiceChunks=[];
let _voiceBlob=null;
let _voiceStartTime=0;
let _voiceTimerInterval=null;
let _voiceDuration=0;
let _voiceLocked=false;
let _voiceDragX=0;
let _voiceDragY=0;
let _previewAudio=null;
let _previewPlaying=false;
let _previewScrubInterval=null;

function _fmtDur(s){
  s=Math.floor(s);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
}

/* Start recording */
async function voiceStartRecording(){
  if(_voiceRecorder) return;
  try {
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    _voiceChunks=[];
    _voiceBlob=null;
    _voiceLocked=false;
    _voiceStartTime=Date.now();

    _voiceRecorder=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":"audio/ogg"});
    _voiceRecorder.ondataavailable=e=>{if(e.data.size>0) _voiceChunks.push(e.data);};
    _voiceRecorder.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      _voiceBlob=new Blob(_voiceChunks,{type:_voiceRecorder.mimeType});
      _voiceDuration=(Date.now()-_voiceStartTime)/1000;
      if(_voiceLocked){
        // was locked — show preview
        voiceShowPreview();
      }
      // else already handled by voiceFinish/voiceCancel
    };
    _voiceRecorder.start(100);

    // UI: show overlay, animate mic
    $("#cvVoiceOverlay").classList.add("show");
    $("#cvMic").classList.add("recording");
    $("#cvInputBar").classList.add("recording-active");
    $("#cvInput").style.visibility="hidden";
    $("#cvAttach").style.visibility="hidden";
    $("#cvVoiceCancelTxt").textContent="Slide to cancel";
    $("#cvVoiceOverlay").classList.remove("cancel-zone");

    // Timer
    _voiceTimerInterval=setInterval(()=>{
      const s=(Date.now()-_voiceStartTime)/1000;
      $("#cvVoiceTimer").textContent=_fmtDur(s);
    },300);

    vibrate(35);
  } catch(err){
    showToast("Mic Error","Microphone permission denied","bad");
  }
}

/* Stop and determine outcome */
function voiceStopRecording(send=false){
  if(!_voiceRecorder) return;
  clearInterval(_voiceTimerInterval);
  _voiceTimerInterval=null;

  $("#cvVoiceOverlay").classList.remove("show");
  $("#cvMic").classList.remove("recording");
  $("#cvInputBar").classList.remove("recording-active");
  resetVoiceLockHint();
  resetDragStyles();

  if(!_voiceLocked){
    // Not locked: stop → ondataavailable fires → onstop fires
    // We need to know in onstop whether to send or discard
    _voiceRecorder._sendOnStop=send;
    const origOnStop=_voiceRecorder.onstop;
    _voiceRecorder.onstop=()=>{
      stream_cleanup();
      _voiceBlob=new Blob(_voiceChunks,{type:_voiceRecorder.mimeType});
      _voiceDuration=(Date.now()-_voiceStartTime)/1000;
      if(send && _voiceDuration>=0.5){
        voiceShowPreview();
      } else {
        voiceReset();
      }
    };
  }
  _voiceRecorder.stop();
  _voiceRecorder=null;
}

function stream_cleanup(){
  // tracks already stopped in onstop above
}

function voiceCancel(){
  if(!_voiceRecorder) return;
  clearInterval(_voiceTimerInterval);
  _voiceTimerInterval=null;
  $("#cvVoiceOverlay").classList.remove("show");
  $("#cvMic").classList.remove("recording");
  $("#cvInputBar").classList.remove("recording-active");
  resetVoiceLockHint();
  resetDragStyles();
  _voiceRecorder.onstop=()=>{
    _voiceBlob=null;
    voiceReset();
  };
  _voiceRecorder.stop();
  _voiceRecorder=null;
  vibrate(30);
  showToast("Cancelled","Voice message discarded","");
}

function voiceLock(){
  if(_voiceLocked) return;
  _voiceLocked=true;
  $("#cvVoiceLockHint").classList.remove("show");
  vibrate([15,30,15]);
  // keep recording — mic stays red but not pressed
  // convert overlay to "locked" state with slightly different hint
  const cancelHint=$("#cvVoiceCancelHint");
  cancelHint.querySelector("span").textContent="Recording locked";
  // change overlay to have a stop-record button feel (user can release finger)
  // We'll stop recording when mic is tapped once more (handled by click after lock)
}

function voiceShowPreview(){
  if(!_voiceBlob) return;
  // Show preview bar over input
  const previewEl=$("#cvVoicePreview");
  previewEl.classList.add("show");
  // restore input visibility (behind preview)
  $("#cvInput").style.visibility="";
  $("#cvAttach").style.visibility="";

  // build Audio element
  if(_previewAudio) { _previewAudio.pause(); _previewAudio=null; }
  _previewAudio=new Audio(URL.createObjectURL(_voiceBlob));
  _previewAudio.ontimeupdate=()=>{ voiceUpdateScrubber(); };
  _previewAudio.onended=()=>{
    _previewPlaying=false;
    $("#cvPreviewPlayIcon").className="ph ph-play";
    clearInterval(_previewScrubInterval);
  };
  $("#cvPreviewScrubber").value=0;
  $("#cvPreviewTime").textContent=_fmtDur(_voiceDuration);
}

function voiceUpdateScrubber(){
  if(!_previewAudio||!_previewAudio.duration) return;
  const pct=(_previewAudio.currentTime/_previewAudio.duration)*100;
  $("#cvPreviewScrubber").value=pct;
  const remaining=_previewAudio.duration-_previewAudio.currentTime;
  $("#cvPreviewTime").textContent=_fmtDur(remaining);
}

function voiceReset(){
  _voiceBlob=null;_voiceChunks=[];_voiceLocked=false;
  _voiceDuration=0;
  if(_previewAudio){_previewAudio.pause();_previewAudio=null;}
  _previewPlaying=false;
  clearInterval(_previewScrubInterval);
  $("#cvVoicePreview").classList.remove("show");
  $("#cvVoiceOverlay").classList.remove("show");
  $("#cvMic").classList.remove("recording");
  $("#cvInputBar").classList.remove("recording-active");
  $("#cvInput").style.visibility="";
  $("#cvAttach").style.visibility="";
  $("#cvVoiceTimer").textContent="0:00";
  $("#cvPreviewScrubber").value=0;
  $("#cvPreviewTime").textContent="0:00";
  resetVoiceLockHint();
  resetDragStyles();
}

function resetVoiceLockHint(){
  $("#cvVoiceLockHint").classList.remove("show");
}
function resetDragStyles(){
  const mic=$("#cvMic");
  mic.style.transform="";
  $("#cvVoiceOverlay").classList.remove("cancel-zone");
}

/* Preview controls */
$("#cvPreviewPlay").addEventListener("click",()=>{
  if(!_previewAudio) return;
  if(_previewPlaying){
    _previewAudio.pause();
    _previewPlaying=false;
    $("#cvPreviewPlayIcon").className="ph ph-play";
  } else {
    _previewAudio.play();
    _previewPlaying=true;
    $("#cvPreviewPlayIcon").className="ph ph-pause";
  }
});

$("#cvPreviewScrubber").addEventListener("input",e=>{
  if(!_previewAudio||!_previewAudio.duration) return;
  _previewAudio.currentTime=(_previewAudio.duration*(e.target.value/100));
});

$("#cvPreviewDiscard").addEventListener("click",()=>{
  vibrate(20);
  voiceReset();
});

$("#cvPreviewSend").addEventListener("click",()=>{
  vibrate(25);
  cvSendVoice();
});

/* ── DRAG LOGIC (pointer events for cross-platform) ── */
let _micPointerDown=false;
let _micPointerStartX=0;
let _micPointerStartY=0;
let _lockShown=false;
const CANCEL_THRESHOLD=80;   // px left
const LOCK_THRESHOLD=70;     // px up

$("#cvMic").addEventListener("pointerdown",async e=>{
  // if locked, a tap sends to preview
  if(_voiceLocked){
    voiceStopRecording(true);
    return;
  }
  // if preview is showing, ignore
  if($("#cvVoicePreview").classList.contains("show")) return;

  _micPointerDown=true;
  _micPointerStartX=e.clientX;
  _micPointerStartY=e.clientY;
  _lockShown=false;
  $("#cvMic").setPointerCapture(e.pointerId);
  await voiceStartRecording();
  // show lock hint after 400ms
  setTimeout(()=>{
    if(_micPointerDown && _voiceRecorder){
      $("#cvVoiceLockHint").classList.add("show");
      _lockShown=true;
    }
  },400);
});

$("#cvMic").addEventListener("pointermove",e=>{
  if(!_micPointerDown||!_voiceRecorder) return;
  const dx=_micPointerStartX-e.clientX;  // positive = dragged left
  const dy=_micPointerStartY-e.clientY;  // positive = dragged up

  // Drag left → cancel zone
  if(dx>10){
    const pct=Math.min(dx/CANCEL_THRESHOLD,1);
    $("#cvVoiceOverlay").classList.toggle("cancel-zone",pct>0.5);
    // Shift hint label opacity
    const hint=$("#cvVoiceCancelHint");
    hint.style.color=pct>0.5?"var(--bad)":"";
  }

  // Drag up → lock hint follows
  if(dy>10&&_lockShown){
    const pct=Math.min(dy/LOCK_THRESHOLD,1);
    $("#cvVoiceLockHint").style.transform=`translateY(${-pct*6}px)`;
    if(pct>=1){ voiceLock(); _micPointerDown=false; return; }
  }
});

$("#cvMic").addEventListener("pointerup",e=>{
  if(!_micPointerDown) return;
  _micPointerDown=false;
  if(_voiceLocked) return; // locked = don't stop on release

  const dx=_micPointerStartX-e.clientX;
  const dy=_micPointerStartY-e.clientY;

  if(dx>=CANCEL_THRESHOLD){
    voiceCancel();
  } else {
    const dur=(Date.now()-_voiceStartTime)/1000;
    if(dur<0.5){
      voiceCancel();
      showToast("Too short","Hold longer to record a voice message","");
    } else {
      voiceStopRecording(true);
    }
  }
});

$("#cvMic").addEventListener("pointercancel",()=>{
  if(!_micPointerDown) return;
  _micPointerDown=false;
  if(_voiceLocked) return;
  voiceCancel();
});

/* ── Send voice message to Supabase ── */
async function cvSendVoice(){
  if(!_voiceBlob) return;
  const blob=_voiceBlob;
  const dur=_voiceDuration;
  voiceReset(); // hide preview immediately

  vibrate(25);
  const ext=blob.type.includes("webm")?"webm":"ogg";
  const path=`voice-messages/${currentUser.id}/${Date.now()}.${ext}`;
  const localUrl=URL.createObjectURL(blob);

  const tempMsg={
    id:"temp-voice-"+Date.now(),
    sender_id:currentUser.id,receiver_id:cvPartnerId,
    content:null,type:"voice",media_url:localUrl,
    duration:dur,
    is_read:false,created_at:new Date().toISOString(),
  };
  cvMessages.push(tempMsg);
  renderCvMessages(false);
  cvScrollToBottom(true);

  const rows=$("#cvMessages").querySelectorAll(".bubble-row.out");
  const last=rows[rows.length-1];
  if(last) last.classList.add("animate");

  const {error:upErr}=await sb.storage.from("voice-messages").upload(path,blob,{cacheControl:"3600",upsert:false,contentType:blob.type});
  if(upErr){
    cvMessages=cvMessages.filter(m=>m.id!==tempMsg.id);
    renderCvMessages(false);
    showToast("Error","Failed to upload voice message","bad");
    return;
  }

  const {data:urlData}=sb.storage.from("voice-messages").getPublicUrl(path);
  const {data,error}=await sb.from("messages").insert({
    sender_id:currentUser.id,receiver_id:cvPartnerId,
    content:null,type:"voice",media_url:urlData.publicUrl,
  }).select().single();

  if(error){cvMessages=cvMessages.filter(m=>m.id!==tempMsg.id);renderCvMessages(false);return;}
  const idx=cvMessages.findIndex(m=>m.id===tempMsg.id);
  if(idx>-1) cvMessages[idx]=data;
  URL.revokeObjectURL(localUrl);
}

/* ── Voice bubble playback ── */
const _bubbleAudios={};

function voiceBubbleToggle(url,vid,btn){
  // stop any other playing audio
  Object.entries(_bubbleAudios).forEach(([k,a])=>{
    if(k!==vid&&!a.paused){
      a.pause();
      const otherBtn=document.querySelector(`#${k} .voice-play-btn i`);
      if(otherBtn) otherBtn.className="ph ph-play";
    }
  });

  if(!_bubbleAudios[vid]){
    const a=new Audio(url);
    _bubbleAudios[vid]=a;

    a.onloadedmetadata=()=>{
      const dur=document.getElementById(vid+"-dur");
      if(dur) dur.textContent=_fmtDur(a.duration);
    };
    a.ontimeupdate=()=>{
      if(!a.duration) return;
      const scrubber=document.querySelector(`#${vid} .voice-scrubber`);
      if(scrubber) scrubber.value=(a.currentTime/a.duration)*100;
      const dur=document.getElementById(vid+"-dur");
      if(dur) dur.textContent=_fmtDur(a.duration-a.currentTime);
    };
    a.onended=()=>{
      const i=btn.querySelector("i");
      if(i) i.className="ph ph-play";
      const scrubber=document.querySelector(`#${vid} .voice-scrubber`);
      if(scrubber) scrubber.value=0;
      const dur=document.getElementById(vid+"-dur");
      if(dur && a.duration) dur.textContent=_fmtDur(a.duration);
    };
  }

  const audio=_bubbleAudios[vid];
  const icon=btn.querySelector("i");
  if(audio.paused){
    audio.play();
    if(icon) icon.className="ph ph-pause";
  } else {
    audio.pause();
    if(icon) icon.className="ph ph-play";
  }
}

function voiceBubbleScrub(vid,pct){
  const audio=_bubbleAudios[vid];
  if(audio&&audio.duration) audio.currentTime=audio.duration*(pct/100);
}

/* ========================================================
   AUTH & INIT
   ======================================================== */
(async function init(){
  const {data}=await sb.auth.getSession();
  if(!data.session){window.location.href="index.html";return;}
  currentUser=data.session.user;

  await Promise.all([loadMyProfile(),loadConversations()]);

  // Auto-open chat if redirected from discover.html with ?user=<id>
  const _params=new URLSearchParams(window.location.search);
  const _targetUser=_params.get("user");
  if(_targetUser){
    history.replaceState(null,"","chats.html");
    openChat(_targetUser);
  }

  $("#loader").classList.add("hide");
  setTimeout(()=>{const l=$("#loader");if(l) l.remove();},400);

  // Realtime: new messages → refresh list
  sb.channel("chats-realtime")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>{
      const msg=payload.new;
      if(msg.sender_id===currentUser.id||msg.receiver_id===currentUser.id){
        loadConversations();
      }
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"},()=>{
      loadConversations();
    })
    .subscribe();

  // Realtime: online status in list
  sb.channel("chats-profiles-online")
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"profiles"},payload=>{
      const updated=payload.new;
      const conv=conversations.find(c=>c.partner.id===updated.id);
      if(conv){conv.partner.is_online=updated.is_online;renderList();}
    })
    .subscribe();
})();
