<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1d4ed8" />
<title>NovaChat — Chats</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='30' r='26' fill='%231d4ed8'/><circle cx='22' cy='30' r='3.2' fill='white'/><circle cx='32' cy='30' r='3.2' fill='white'/><circle cx='42' cy='30' r='3.2' fill='white'/><path d='M26 52 L32 60 L38 52 Z' fill='%231d4ed8'/></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
/* ====== UNIFIED CSS VARIABLES (matches profile.html / discover.html) ====== */
:root{
  --bg:#c8d9f5;
  --bg-2:#d4e2f8;
  --card:#ffffff;
  --card-2:#f8faff;
  --ink:#0b1b3a;
  --ink-soft:#5b6b8c;
  --muted:#9aa6c2;
  --line:#dde8f8;
  --surface:#eaf2ff;
  --surface-2:#dbe7fb;
  --surface-border:#c7daf3;
  --brand:#1d4ed8;
  --brand-2:#2563eb;
  --brand-3:#60a5fa;
  --brand-glow:rgba(29,78,216,.45);
  --good:#22c55e;
  --warn:#f59e0b;
  --bad:#ef4444;
  --radius:9px;
  --radius-lg:13px;
  --shadow-sm:0 8px 24px -6px rgba(15,40,120,.22);
  --shadow:0 20px 50px -14px rgba(15,40,120,.32);
  --shadow-lg:0 28px 70px -18px rgba(15,40,120,.40);
  --transition:.25s cubic-bezier(.4,.0,.2,1);
  --spring:cubic-bezier(.34,1.4,.64,1);

  /* ── Bubble colours (light) ── */
  --bubble-in-bg: linear-gradient(135deg, #2563eb, #1d4ed8);
  --bubble-in-text: #ffffff;
  --bubble-in-border: transparent;
  --bubble-out-bg: rgba(255,255,255,0.55);
  --bubble-out-text: var(--ink);
  --bubble-out-border: rgba(199,218,243,0.7);
}

/* ====== UNIFIED DARK THEME ====== */
[data-theme="dark"]{
  --bg:#0b1221;
  --bg-2:#0f1724;
  --card:#182033;
  --card-2:#1a2235;
  --ink:#ecf0f7;
  --ink-soft:#8ea0b9;
  --muted:#596d86;
  --line:#28384d;
  --surface:#0b1620;
  --surface-2:#182030;
  --surface-border:#273d56;
  --shadow-sm:0 8px 24px -6px rgba(0,0,0,.50);
  --shadow:0 20px 50px -14px rgba(0,0,0,.62);
  --shadow-lg:0 28px 70px -18px rgba(0,0,0,.72);

  /* ── Bubble colours (dark) ── */
  --bubble-in-bg: linear-gradient(135deg, #2563eb, #1d4ed8);
  --bubble-in-text: #ffffff;
  --bubble-in-border: transparent;
  --bubble-out-bg: rgba(255,255,255,0.06);
  --bubble-out-text: #ecf0f7;
  --bubble-out-border: rgba(39,61,86,0.55);
}
[data-theme="dark"] body{
  background:
    radial-gradient(ellipse 110% 60% at 60% 0%, #0d1a2e 0%, transparent 65%),
    radial-gradient(ellipse 80% 70% at -5% 100%, #091524 0%, transparent 60%),
    var(--bg);
}
[data-theme="dark"] .topbar{background:rgba(24,32,51,.95);border-color:#28384d;}
[data-theme="dark"] .topbar .icon-btn,
[data-theme="dark"] #themeToggle{background:rgba(11,18,33,.65);border-color:#28384d;color:#ecf0f7;}
[data-theme="dark"] .tabbar{background:rgba(24,32,51,.95);border-color:#28384d;}
[data-theme="dark"] .tab-btn{color:#596d86;}
[data-theme="dark"] .tab-btn.active{color:#fff;}
[data-theme="dark"] .search-bar{background:rgba(11,22,32,.6);border-color:#28384d;color:#ecf0f7;}
[data-theme="dark"] .search-bar::placeholder{color:#596d86;}
[data-theme="dark"] .search-wrap i{color:#596d86;}
[data-theme="dark"] .chat-island{background:var(--card);border-color:#1a2235;}
[data-theme="dark"] .chat-row:active{background:rgba(255,255,255,.04);}
[data-theme="dark"] .c-time{color:#596d86;}
[data-theme="dark"] .c-preview{color:#596d86;}
[data-theme="dark"] .empty-state{color:#596d86;}
[data-theme="dark"] .section-chip{background:rgba(11,22,32,.6);border-color:#28384d;color:#8ea0b9;}
[data-theme="dark"] .menu-sheet{background:var(--card);}
[data-theme="dark"] .menu-item{color:#f1f5f9;}
[data-theme="dark"] .menu-item:active{background:rgba(255,255,255,.06);}
[data-theme="dark"] .menu-divider{background:#28384d;}
[data-theme="dark"] .topbar-name{color:#ecf0f7;}
[data-theme="dark"] .topbar-sub{color:#596d86;}

/* ====== RESET ====== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{-webkit-user-select:none;-moz-user-select:none;user-select:none;}
input,textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text;}
button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;}
a{text-decoration:none;}

body{
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse 110% 60% at 60% 0%, #a8c4f0 0%, transparent 65%),
    radial-gradient(ellipse 80% 70% at -5% 100%, #9ab8ee 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 100% 60%, #b0ccf5 0%, transparent 55%),
    var(--bg);
  min-height:100vh;
  overflow-x:hidden;
}
body::-webkit-scrollbar{display:none;}
body{scrollbar-width:none;}

/* ====== SMOOTH TRANSITIONS ====== */
html{transition:background-color .35s ease;}
body,.topbar,.tabbar,.chat-island,.search-bar,.chat-row,.menu-sheet{
  transition-property:background-color,border-color,color,box-shadow;
  transition-duration:.35s;
  transition-timing-function:ease;
}

/* ====== PAGE ====== */
.page{
  max-width:440px;
  margin:0 auto;
  min-height:100vh;
  padding:calc(76px + env(safe-area-inset-top,0px)) 0 calc(96px + env(safe-area-inset-bottom,0px));
}

/* ====== OFFLINE BANNER ====== */
.offline{
  position:fixed;top:0;left:0;right:0;
  background:var(--bad);color:#fff;
  text-align:center;padding:6px 10px;
  font-size:13px;font-weight:600;z-index:200;
  transform:translateY(-100%);transition:transform .3s;
}
.offline.show{transform:translateY(0);}

/* ====== TOPBAR — Profile-aware ====== */
.topbar{
  position:fixed;
  top:calc(10px + env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%);
  width:min(calc(100vw - 24px),416px);
  height:62px;z-index:80;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 10px 0 12px;
  border-radius:18px;
  background:rgba(246,250,255,.93);
  backdrop-filter:blur(12px) saturate(160%);
  -webkit-backdrop-filter:blur(12px) saturate(160%);
  border:1px solid rgba(199,218,243,.7);
  box-shadow:0 24px 60px -17px rgba(15,40,120,.38);
}

/* Left: avatar + name */
.topbar-profile{display:flex;align-items:center;gap:10px;}
.topbar-avatar{
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#fff;
  flex-shrink:0;position:relative;
  box-shadow:0 3px 12px -3px rgba(0,0,60,.25);
  overflow:hidden;
  background:linear-gradient(135deg,#a8c4f0,#1d4ed8);
}
.topbar-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.topbar-online-dot{
  position:absolute;right:0;bottom:0;
  width:11px;height:11px;border-radius:50%;
  background:var(--good);
  border:2px solid rgba(246,250,255,.95);
}
.topbar-text{display:flex;flex-direction:column;gap:0;}
.topbar-name{font-size:15px;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:-.2px;}
.topbar-sub{font-size:11px;font-weight:500;color:var(--muted);margin-top:1px;}

/* Right: action buttons */
.topbar-right{display:flex;align-items:center;gap:6px;}
.icon-btn{
  width:38px;height:38px;border-radius:9px;
  display:grid;place-items:center;
  color:var(--ink-soft);
  background:rgba(219,231,251,.6);
  border:1px solid rgba(199,218,243,.6);
  transition:transform var(--transition),background var(--transition);
  flex-shrink:0;
}
.icon-btn:active{transform:scale(.92);}
.icon-btn i{font-size:20px;}
#themeToggle{
  width:38px;height:38px;border-radius:9px;
  display:grid;place-items:center;
  color:var(--ink);
  background:rgba(219,231,251,.6);
  border:1px solid rgba(199,218,243,.6);
  transition:transform var(--transition),background var(--transition);
  flex-shrink:0;
}
#themeToggle:active{transform:scale(.92);}
#themeToggle i{font-size:20px;transition:transform .25s var(--spring);}
@keyframes themeShake{
  0%{transform:rotate(0deg);}20%{transform:rotate(-18deg);}
  40%{transform:rotate(18deg);}60%{transform:rotate(-12deg);}
  80%{transform:rotate(10deg);}100%{transform:rotate(0deg);}
}
#themeToggle.shaking i{animation:themeShake .4s ease;}

/* ====== SEARCH ====== */
.search-section{padding:0 16px 12px;}
.search-wrap{position:relative;}
.search-wrap .search-icon{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:18px;color:var(--muted);pointer-events:none;
  transition:opacity .2s ease,transform .2s var(--spring);
}
.search-wrap .search-clear{
  position:absolute;right:14px;top:50%;transform:translateY(-50%) scale(0);
  width:28px;height:28px;border-radius:50%;
  background:var(--surface-2);border:none;cursor:pointer;
  display:grid;place-items:center;
  opacity:0;
  transition:opacity .2s ease,transform .25s var(--spring);
  color:var(--ink-soft);pointer-events:none;
}
.search-wrap .search-clear i{position:static;transform:none;font-size:14px;color:var(--ink-soft);pointer-events:none;}
.search-wrap.has-text .search-clear{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto;}
.search-wrap.has-text .search-icon{opacity:0;transform:translateY(-50%) scale(.7);}
.search-bar{
  width:100%;height:46px;
  padding:0 44px 0 46px;
  border-radius:999px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(8px);
  border:1px solid rgba(199,218,243,.7);
  box-shadow:var(--shadow-sm);
  font-size:14px;font-weight:500;
  outline:none;
  transition:border-color var(--transition),box-shadow var(--transition);
  color:var(--ink);
  font-family:'Poppins',sans-serif;
}
.search-bar::placeholder{color:var(--muted);}
.search-bar:focus{border-color:var(--brand-3);box-shadow:0 0 0 3px rgba(96,165,250,.2);}

/* ====== SECTION HEADER ====== */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px 10px;
}
.section-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--ink-soft);
  background:rgba(255,255,255,.6);
  border:1px solid rgba(199,218,243,.6);
  border-radius:999px;padding:4px 12px;
}
.section-chip i{font-size:13px;}
.chats-count{font-size:13px;font-weight:600;color:var(--muted);}

/* ====== CHAT LIST ====== */
.list-islands{
  display:flex;flex-direction:column;gap:6px;
  margin:0 16px;
  opacity:0;transform:translateY(14px);
  animation:cardIn .55s var(--spring) forwards .1s;
}
@keyframes cardIn{to{opacity:1;transform:translateY(0);}}

.chat-island{
  background:var(--card);
  border:1px solid rgba(199,218,243,.5);
  border-radius:16px;
  box-shadow:0 4px 16px -6px rgba(15,40,120,.13);
  overflow:hidden;
  transition:box-shadow var(--transition),transform var(--transition);
}
.chat-island:active{
  transform:scale(.985);
  box-shadow:0 2px 8px -4px rgba(15,40,120,.12);
}

.chat-row{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;
  cursor:pointer;
  transition:background var(--transition);
  position:relative;
}
.chat-row:active{background:rgba(29,78,216,.04);}

/* Avatar */
.c-avatar{
  width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;
  font-weight:700;font-size:16px;color:#fff;
  flex-shrink:0;position:relative;
  box-shadow:0 4px 14px -4px rgba(0,0,60,.25);
}
.c-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.c-dot{
  position:absolute;right:1px;bottom:1px;
  width:13px;height:13px;border-radius:50%;
  background:var(--good);
  border:2.5px solid var(--card);
  display:none;
}
.c-dot.show{display:block;}

/* Info */
.c-info{flex:1;min-width:0;}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.c-name{font-size:15px;font-weight:700;color:var(--ink);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-time{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.c-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px;}
.c-preview{
  font-size:12px;color:var(--ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;min-width:0;
}
.c-preview.unread{color:var(--ink);font-weight:600;}
.c-badge{
  min-width:20px;height:20px;border-radius:999px;
  background:var(--brand);color:#fff;
  font-size:11px;font-weight:700;
  display:grid;place-items:center;
  padding:0 5px;flex-shrink:0;
  transform:scale(0);opacity:0;
  transition:transform .3s var(--spring),opacity .2s ease;
}
.c-badge.show{transform:scale(1);opacity:1;}

/* ====== EMPTY STATE ====== */
.empty-state{
  text-align:center;padding:60px 24px;
  color:var(--ink-soft);
}
.empty-state i{font-size:52px;color:var(--muted);display:block;margin-bottom:12px;}
.empty-state p{font-size:14px;font-weight:500;margin:0 0 4px;}
.empty-state small{font-size:12px;color:var(--muted);}

/* ====== BOTTOM TAB ISLAND ====== */
.tabbar{
  position:fixed;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  width:min(calc(100vw - 24px),416px);
  height:62px;
  background:rgba(246,250,255,.93);
  backdrop-filter:blur(5px) saturate(130%);
  -webkit-backdrop-filter:blur(5px) saturate(130%);
  border:1px solid rgba(199,218,243,.8);
  border-radius:13px;
  box-shadow:0 24px 60px -17px rgba(15,40,120,.38);
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 6px;z-index:80;
}
.tab-btn{
  position:relative;flex:1;height:100%;border-radius:9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--ink-soft);font-size:11px;font-weight:600;
  text-decoration:none;
  transition:color var(--transition);
}
.tab-btn i{font-size:22px;transition:transform var(--transition);z-index:2;position:relative;}
.tab-btn span{z-index:2;position:relative;}
.tab-btn::before{
  content:"";position:absolute;inset:0;border-radius:9px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 8px 20px -8px var(--brand-glow);
  opacity:0;transform:scale(.85);
  transition:opacity .25s var(--transition),transform .35s var(--spring);
  z-index:1;
}
.tab-btn.active{color:#fff;}
.tab-btn.active::before{opacity:1;transform:scale(1);}
.tab-btn.active i{transform:scale(1.05);}
.tab-btn .notif-dot{
  position:absolute;top:8px;right:calc(50% - 16px);
  width:9px;height:9px;border-radius:50%;
  background:var(--bad);border:2px solid rgba(246,250,255,.93);
  transform:scale(0);opacity:0;
  transition:transform .35s var(--spring),opacity .25s var(--transition);
  z-index:3;
}
.tab-btn .notif-dot.show{transform:scale(1);opacity:1;}

/* ====== LOADER ====== */
.loader{
  position:fixed;inset:0;z-index:999;
  background:var(--bg);
  display:grid;place-items:center;
  transition:opacity .3s ease;
}
.loader.hide{opacity:0;pointer-events:none;}
.spin{
  width:36px;height:36px;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--brand);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ====== MENU SHEET ====== */
.menu-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(11,27,58,.0);
  backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);
  pointer-events:none;
  transition:background .3s ease,backdrop-filter .3s ease,-webkit-backdrop-filter .3s ease;
}
.menu-overlay.show{
  background:rgba(11,27,58,.4);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  pointer-events:auto;
}
.menu-sheet{
  position:fixed;bottom:0;left:50%;
  transform:translateX(-50%) translateY(100%);
  width:min(100vw,440px);
  border-radius:20px 20px 0 0;
  background:var(--card);
  box-shadow:0 -12px 40px -8px rgba(15,40,120,.25);
  z-index:101;
  padding:8px 0 calc(16px + env(safe-area-inset-bottom,0px));
  transition:transform .4s var(--spring);
}
.menu-sheet.show{transform:translateX(-50%) translateY(0);}
.menu-handle{width:36px;height:4px;border-radius:999px;background:rgba(0,0,0,.12);margin:6px auto 14px;}
[data-theme="dark"] .menu-handle{background:rgba(255,255,255,.12);}
.menu-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 20px;font-size:15px;font-weight:600;color:var(--ink);
  transition:background var(--transition);cursor:pointer;
}
.menu-item:active{background:rgba(29,78,216,.06);}
.menu-item i{font-size:20px;color:var(--ink-soft);}
.menu-item.danger{color:var(--bad);}
.menu-item.danger i{color:var(--bad);}
.menu-divider{height:1px;background:var(--line);margin:4px 0;}

/* ======================================================
   CHAT VIEW (inline — no page reload)
   ====================================================== */
.chat-view{
  position:fixed;inset:0;z-index:150;
  display:flex;flex-direction:column;
  max-width:440px;margin:0 auto;
  background:var(--bg);
  /* entrance: slide up from bottom */
  transform:translateY(100%);
  opacity:0;
  transition:transform .42s var(--spring), opacity .3s ease;
  pointer-events:none;
  /* dark bg gradient */
}
.chat-view.open{
  transform:translateY(0);
  opacity:1;
  pointer-events:auto;
}

/* Duplicate body bg inside chat view */
.chat-view::before{
  content:"";
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 110% 60% at 60% 0%, #a8c4f0 0%, transparent 65%),
    radial-gradient(ellipse 80% 70% at -5% 100%, #9ab8ee 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 100% 60%, #b0ccf5 0%, transparent 55%),
    var(--bg);
}
[data-theme="dark"] .chat-view::before{
  background:
    radial-gradient(ellipse 110% 60% at 60% 0%, #0d1f3c 0%, transparent 65%),
    radial-gradient(ellipse 80% 70% at -5% 100%, #0a1628 0%, transparent 60%),
    var(--bg);
}

/* ── Chat Header ── */
.cv-header{
  position:relative;z-index:1;
  flex-shrink:0;
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
  background:rgba(246,250,255,.95);
  backdrop-filter:blur(12px) saturate(140%);
  -webkit-backdrop-filter:blur(12px) saturate(140%);
  border-bottom:1px solid rgba(199,218,243,.6);
  box-shadow:0 4px 20px -8px rgba(15,40,120,.18);
}
[data-theme="dark"] .cv-header{background:rgba(24,32,51,.95);border-color:#28384d;}

.cv-back{
  width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;
  color:var(--ink-soft);flex-shrink:0;
  transition:transform var(--transition),background var(--transition);
  cursor:pointer;
}
.cv-back:active{transform:scale(.88);background:var(--surface);}
.cv-back i{font-size:22px;}

.cv-avatar{
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;
  font-weight:700;font-size:14px;color:#fff;
  flex-shrink:0;position:relative;
  box-shadow:0 3px 10px -3px rgba(0,0,60,.2);
  overflow:hidden;
}
.cv-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.cv-online-dot{
  position:absolute;right:0;bottom:0;
  width:11px;height:11px;border-radius:50%;
  background:var(--good);
  border:2px solid rgba(246,250,255,.95);
  display:none;
}
.cv-online-dot.show{display:block;}

.cv-info{flex:1;min-width:0;}
.cv-name{font-size:15px;font-weight:700;color:var(--ink);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cv-status{font-size:11px;font-weight:500;color:var(--muted);margin-top:1px;}
.cv-status.online{color:var(--good);}

.cv-actions{display:flex;gap:6px;flex-shrink:0;}
.cv-btn{
  width:36px;height:36px;border-radius:9px;
  display:grid;place-items:center;
  color:var(--ink-soft);
  background:rgba(219,231,251,.5);
  border:1px solid rgba(199,218,243,.5);
  transition:transform var(--transition),background var(--transition);
  cursor:pointer;
}
.cv-btn:active{transform:scale(.88);}
.cv-btn i{font-size:18px;}

/* ── Messages Area ── */
.cv-messages{
  position:relative;z-index:1;
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 14px 12px;
  display:flex;flex-direction:column;gap:4px;
  scroll-behavior:smooth;
}
.cv-messages::-webkit-scrollbar{display:none;}
.cv-messages{scrollbar-width:none;}

/* Date chip */
.date-chip{
  align-self:center;
  font-size:11px;font-weight:600;
  color:var(--muted);
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(8px);
  border:1px solid rgba(199,218,243,.5);
  border-radius:999px;
  padding:4px 14px;
  margin:10px 0 6px;
  letter-spacing:.3px;
}
[data-theme="dark"] .date-chip{background:rgba(20,31,54,.85);color:#8ea0b9;border-color:#334155;}

/* ── Bubbles ── */
.bubble-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
  max-width:82%;
}
.bubble-row.out{
  align-self:flex-end;
  flex-direction:row-reverse;
}
.bubble-row.in{
  align-self:flex-start;
}

.bubble-mini-avatar{
  width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;
  font-size:10px;font-weight:700;color:#fff;
  flex-shrink:0;
  box-shadow:0 2px 6px -2px rgba(0,0,60,.2);
  opacity:0;
  transition:opacity .2s;
  overflow:hidden;
}
.bubble-mini-avatar.show{opacity:1;}
.bubble-mini-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}

.bubble{
  padding:10px 14px;
  border-radius:18px;
  font-size:14px;font-weight:500;
  line-height:1.5;
  word-break:break-word;
  position:relative;
  max-width:100%;
}

/* Outgoing — ghost / almost invisible */
.bubble-row.out .bubble{
  background:var(--bubble-out-bg);
  color:var(--bubble-out-text);
  border:1px solid var(--bubble-out-border);
  border-bottom-right-radius:5px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 2px 10px -4px rgba(15,40,120,.10);
}

/* Incoming — solid brand blue */
.bubble-row.in .bubble{
  background:var(--bubble-in-bg);
  color:var(--bubble-in-text);
  border:1px solid var(--bubble-in-border);
  border-bottom-left-radius:5px;
  box-shadow:0 6px 20px -6px var(--brand-glow);
}

/* Timestamps */
.bubble-time{
  font-size:10px;font-weight:500;
  display:block;
  text-align:right;
  margin-top:4px;
  color:rgba(255,255,255,.65);
}
.bubble-row.out .bubble-time{color:var(--ink-soft);}

/* Seen receipt */
.seen-wrap{
  display:flex;justify-content:flex-end;
  padding-right:4px;
  margin-top:2px;
  margin-bottom:4px;
  min-height:14px;
}
.seen-label{
  font-size:10px;font-weight:600;
  color:var(--brand-3);
  opacity:0;transform:translateY(4px);
  transition:opacity .3s ease,transform .3s var(--spring);
}
.seen-label.show{opacity:1;transform:translateY(0);}

/* Image bubble */
.bubble-img{
  max-width:220px;max-height:260px;
  border-radius:14px;object-fit:cover;
  display:block;cursor:pointer;
  opacity:0;
  transition:opacity .4s ease, transform .3s var(--spring);
  transform:scale(.96);
}
.bubble-img.loaded{opacity:1;transform:scale(1);}
.bubble-img-wrap{padding:4px;border-radius:16px;overflow:hidden;}

/* Empty messages */
.empty-msgs{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:32px;
  gap:10px;color:var(--muted);
  animation:fadeIn .5s ease both .2s;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.empty-msgs i{font-size:48px;color:var(--surface-border);}
.empty-msgs p{font-size:14px;font-weight:600;margin:0;color:var(--ink-soft);}
.empty-msgs small{font-size:12px;}

/* ── Bubble entrance animations ── */
@keyframes bubbleInRight{
  from{opacity:0;transform:translateX(18px) scale(.92);}
  to{opacity:1;transform:translateX(0) scale(1);}
}
@keyframes bubbleInLeft{
  from{opacity:0;transform:translateX(-18px) scale(.92);}
  to{opacity:1;transform:translateX(0) scale(1);}
}
@keyframes bubbleInRightSpring{
  0%{opacity:0;transform:translateX(18px) scale(.88);}
  60%{transform:translateX(-4px) scale(1.03);}
  80%{transform:translateX(2px) scale(.99);}
  100%{opacity:1;transform:translateX(0) scale(1);}
}
.bubble-row.out.animate{animation:bubbleInRightSpring .42s var(--spring) both;}
.bubble-row.in.animate{animation:bubbleInLeft .38s var(--spring) both;}

/* ── Input Bar ── */

  position:relative;z-index:1;

}

.cv-attach.hidden{opacity:0;pointer-events:none;transform:scale(.8);}
[data-theme="dark"] .cv-attach{background:rgba(20,31,54,.92);border-color:#334155;color:#94a3b8;}

<script>
/* ============ Supabase ============ */
const SUPABASE_URL = "https://yjfxoximfczrtfgnnqyc.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqZnhveGltZmN6cnRmZ25ucXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MzAwMTksImV4cCI6MjA5NDEwNjAxOX0.rGIpoYFYZ6q6Dz_7etlEqnjKp55BeYp1Iqay-__kfjA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
function vibrate(ms){ navigator.vibrate && navigator.vibrate(ms); }

function initialsOf(name){
  if(!name) return "?";
  return name.trim().split(/\s+/).slice(0,2).map(s=>s[0].toUpperCase()).join("");
}

const AVATAR_COLORS = [
  ["#a8c4f0","#1d4ed8"],["#c4b5fd","#7c3aed"],["#86efac","#16a34a"],
  ["#fca5a5","#dc2626"],["#fde68a","#d97706"],["#a5f3fc","#0891b2"],
  ["#f9a8d4","#db2777"],["#bfdbfe","#2563eb"],
];
function avatarColor(str){
  let hash=0;
  for(let c of (str||"")) hash=(hash*31+c.charCodeAt(0))&0xffffffff;
  return AVATAR_COLORS[Math.abs(hash)%AVATAR_COLORS.length];
}

function fmtTime(ts){
  if(!ts) return "";
  const d=new Date(ts);
  const now=new Date();
  const diff=(now-d)/1000;
  if(diff<60) return "now";
  if(diff<3600){
    const h=d.getHours(),m=d.getMinutes();
    const ampm=h>=12?"pm":"am";
    return `${h%12||12}:${String(m).padStart(2,"0")} ${ampm}`;
  }
  const today=new Date(); today.setHours(0,0,0,0);
  const msgDay=new Date(d); msgDay.setHours(0,0,0,0);
  const dayDiff=Math.round((today-msgDay)/86400000);
  if(dayDiff===0){
    const h=d.getHours(),m=d.getMinutes();
    const ampm=h>=12?"pm":"am";
    return `${h%12||12}:${String(m).padStart(2,"0")} ${ampm}`;
  }
  if(dayDiff===1) return "Yesterday";
  if(dayDiff<7) return d.toLocaleDateString("en",{weekday:"short"});
  return d.toLocaleDateString("en",{month:"short",day:"numeric"});
}

function fmtDateChip(ts){
  const d=new Date(ts);
  const today=new Date(); today.setHours(0,0,0,0);
  const msgDay=new Date(d); msgDay.setHours(0,0,0,0);
  const diff=Math.round((today-msgDay)/86400000);
  if(diff===0) return "Today";
  if(diff===1) return "Yesterday";
  if(diff<7) return d.toLocaleDateString("en",{weekday:"long"});
  return d.toLocaleDateString("en",{month:"long",day:"numeric",year:"numeric"});
}

function sameDay(a,b){
  const da=new Date(a),db=new Date(b);
  return da.getFullYear()===db.getFullYear()&&da.getMonth()===db.getMonth()&&da.getDate()===db.getDate();
}

function previewText(msg){
  if(!msg) return "";
  if(msg.type==="image") return "📷 Photo";
  return msg.content||"";
}

function escHtml(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}

function fmtLastSeen(ts){
  const d=new Date(ts),now=new Date();
  const diff=(now-d)/1000;
  if(diff<3600) return `${Math.floor(diff/60)}m ago`;
  if(diff<86400) return `${Math.floor(diff/3600)}h ago`;
  if(diff<172800) return "yesterday";
  return d.toLocaleDateString("en",{month:"short",day:"numeric"});
}

/* ============ Global State ============ */
let currentUser = null;
let myProfile   = null;
let conversations = [];
let searchQ = "";

/* ========================================================
   CHATS LIST
   ======================================================== */
function renderList(){
  const list = searchQ
    ? conversations.filter(c=>{
        const q=searchQ.toLowerCase();
        const name=(c.partner.full_name||"").toLowerCase();
        const uname=(c.partner.username||"").toLowerCase();
        const preview=previewText(c.lastMsg).toLowerCase();
        return name.includes(q)||uname.includes(q)||preview.includes(q);
      })
    : conversations;

  const el=$("#chatList");
  $("#chatsCount").textContent=list.length+(list.length===1?" chat":" chats");

  const totalUnread=conversations.reduce((sum,c)=>sum+c.unread,0);
  $("#chatDot").classList.toggle("show",totalUnread>0);

  if(list.length===0){
    el.innerHTML=`
      <div class="empty-state">
        <i class="ph ph-chat-circle-slash"></i>
        <p>${searchQ?"No results found":"No conversations yet"}</p>
        <small>${searchQ?"Try a different name":"Go to Discover and start chatting!"}</small>
      </div>`;
    return;
  }

  el.innerHTML=list.map(c=>{
    const p=c.partner;
    const [bg,fg]=avatarColor(p.id);
    const initials=initialsOf(p.full_name||p.username);
    const preview=previewText(c.lastMsg);
    const time=fmtTime(c.lastMsg?.created_at);
    const hasUnread=c.unread>0;

    const avatarInner=p.avatar_url
      ?`<img src="${p.avatar_url}" alt="${initials}" loading="lazy" />`
      :initials;

    return `
      <div class="chat-island" onclick="openChat('${p.id}')">
        <div class="chat-row">
          <div class="c-avatar" style="background:linear-gradient(135deg,${bg},${fg})">
            ${avatarInner}
            <span class="c-dot${p.is_online?" show":""}"></span>
          </div>
          <div class="c-info">
            <div class="c-top">
              <span class="c-name">${p.full_name||p.username||"Unknown"}</span>
              <span class="c-time">${time}</span>
            </div>
            <div class="c-bottom">
              <span class="c-preview${hasUnread?" unread":""}">${preview}</span>
              <span class="c-badge${hasUnread?" show":""}">${c.unread>99?"99+":c.unread}</span>
            </div>
          </div>
        </div>
      </div>`;
  }).join("");
}

async function loadConversations(){
  const {data:msgs,error}=await sb
    .from("messages")
    .select("id,sender_id,receiver_id,content,type,is_read,created_at")
    .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
    .order("created_at",{ascending:false});
  if(error){console.error(error);return;}

  const convMap=new Map();
  for(const msg of (msgs||[])){
    const partnerId=msg.sender_id===currentUser.id?msg.receiver_id:msg.sender_id;
    if(!convMap.has(partnerId)) convMap.set(partnerId,{lastMsg:msg,unread:0});
    if(msg.receiver_id===currentUser.id&&!msg.is_read) convMap.get(partnerId).unread++;
  }

  if(convMap.size===0){conversations=[];renderList();return;}

  const partnerIds=[...convMap.keys()];
  const {data:profiles}=await sb
    .from("profiles")
    .select("id,full_name,username,avatar_url,is_online")
    .in("id",partnerIds);

  const profileMap=new Map((profiles||[]).map(p=>[p.id,p]));

  conversations=partnerIds
    .map(id=>({
      partner:profileMap.get(id)||{id,full_name:"Unknown"},
      lastMsg:convMap.get(id).lastMsg,
      unread:convMap.get(id).unread,
    }))
    .sort((a,b)=>new Date(b.lastMsg.created_at)-new Date(a.lastMsg.created_at));

  renderList();
}

/* ========================================================
   TOPBAR — load current user profile
   ======================================================== */
async function loadMyProfile(){
  const {data}=await sb
    .from("profiles")
    .select("id,full_name,username,avatar_url,is_online")
    .eq("id",currentUser.id)
    .single();
  if(!data) return;
  myProfile=data;

  const initials=initialsOf(data.full_name||data.username);
  const [bg,fg]=avatarColor(data.id);
  const avatarEl=$("#topbarAvatar");
  avatarEl.style.background=`linear-gradient(135deg,${bg},${fg})`;

  if(data.avatar_url){
    avatarEl.innerHTML=`<img src="${data.avatar_url}" alt="${initials}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" /><span class="topbar-online-dot"></span>`;
  } else {
    $("#topbarInitials").textContent=initials;
  }

  $("#topbarName").textContent=data.full_name||data.username||"Me";
  $("#topbarSub").textContent=data.username?`@${data.username}`:"My account";
}

/* ========================================================
   INLINE CHAT VIEW
   ======================================================== */
let cvPartnerId=null;
let cvPartner=null;
let cvMessages=[];
let cvChannel=null;
let cvStatusChannel=null;

function openChat(userId){
  vibrate(30);
  cvPartnerId=userId;
  cvMessages=[];
  cvPartner=null;

  // Reset UI
  $("#cvMessages").innerHTML="";
  $("#cvName").textContent="…";
  $("#cvStatus").textContent="Loading…";
  $("#cvStatus").className="cv-status";
  const av=$("#cvAvatar");
  av.style.background="linear-gradient(135deg,#a8c4f0,#1d4ed8)";
  av.innerHTML="";
  $("#cvInput").value="";
  toggleCvSend();

  // Slide in
  const view=$("#chatView");
  view.classList.add("open");
  document.body.style.overflow="hidden";

  // Load partner + messages
  loadCvPartner();
  loadCvMessages();

  // Realtime channel for this conversation
  if(cvChannel) sb.removeChannel(cvChannel);
  cvChannel=sb.channel("cv-"+[currentUser.id,userId].sort().join("-"))
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async payload=>{
      const msg=payload.new;
      const isRelevant=
        (msg.sender_id===cvPartnerId&&msg.receiver_id===currentUser.id)||
        (msg.sender_id===currentUser.id&&msg.receiver_id===cvPartnerId);
      if(!isRelevant) return;
      const exists=cvMessages.find(m=>m.id===msg.id);
      if(exists) return;
      cvMessages.push(msg);
      renderCvMessages(false);
      const rows=$("#cvMessages").querySelectorAll(`.bubble-row.${msg.sender_id===currentUser.id?"out":"in"}`);
      const last=rows[rows.length-1];
      if(last) last.classList.add("animate");
      cvScrollToBottom(true);
      vibrate(30);
      if(msg.sender_id===cvPartnerId) await cvMarkRead();
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"},payload=>{
      const updated=payload.new;
      const idx=cvMessages.findIndex(m=>m.id===updated.id);
      if(idx>-1){
        cvMessages[idx]=updated;
        const sl=$("#cvSeenLabel");
        if(sl&&updated.is_read) sl.classList.add("show");
      }
    })
    .subscribe();

  // Realtime: partner online status
  if(cvStatusChannel) sb.removeChannel(cvStatusChannel);
  cvStatusChannel=sb.channel("cv-status-"+userId)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"profiles",filter:`id=eq.${userId}`},payload=>{
      if(cvPartner){
        cvPartner.is_online=payload.new.is_online;
        cvPartner.last_seen=payload.new.last_seen;
        updateCvStatus();
        const dot=$("#cvOnlineDot");
        if(dot) dot.classList.toggle("show",cvPartner.is_online);
      }
    })
    .subscribe();
}

function closeChat(){
  vibrate(20);
  const view=$("#chatView");
  view.classList.remove("open");
  document.body.style.overflow="";
  if(cvChannel){sb.removeChannel(cvChannel);cvChannel=null;}
  if(cvStatusChannel){sb.removeChannel(cvStatusChannel);cvStatusChannel=null;}
  // refresh conversation list
  loadConversations();
}

$("#cvBack").addEventListener("click",closeChat);

async function loadCvPartner(){
  const {data}=await sb
    .from("profiles")
    .select("id,full_name,username,avatar_url,is_online,last_seen")
    .eq("id",cvPartnerId)
    .single();
  if(!data) return;
  cvPartner=data;

  const [bg,fg]=avatarColor(data.id);
  const initials=initialsOf(data.full_name||data.username);
  const av=$("#cvAvatar");
  av.style.background=`linear-gradient(135deg,${bg},${fg})`;
  if(data.avatar_url){
    av.innerHTML=`<img src="${data.avatar_url}" alt="${initials}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" /><span class="cv-online-dot${data.is_online?" show":""}" id="cvOnlineDot"></span>`;
  } else {
    av.innerHTML=`${initials}<span class="cv-online-dot${data.is_online?" show":""}" id="cvOnlineDot"></span>`;
  }

  $("#cvName").textContent=data.full_name||data.username||"Unknown";
  updateCvStatus();
}

function updateCvStatus(){
  if(!cvPartner) return;
  const el=$("#cvStatus");
  if(cvPartner.is_online){
    el.textContent="Online";el.className="cv-status online";
  } else {
    el.textContent=cvPartner.last_seen?"Last seen "+fmtLastSeen(cvPartner.last_seen):"Offline";
    el.className="cv-status";
  }
}

async function loadCvMessages(){
  const {data,error}=await sb.from("messages")
    .select("*")
    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${cvPartnerId}),and(sender_id.eq.${cvPartnerId},receiver_id.eq.${currentUser.id})`)
    .order("created_at",{ascending:true});
  if(error){console.error(error);return;}
  cvMessages=data||[];
  renderCvMessages(true);
  await cvMarkRead();
}

async function cvMarkRead(){
  await sb.from("messages")
    .update({is_read:true})
    .eq("sender_id",cvPartnerId)
    .eq("receiver_id",currentUser.id)
    .eq("is_read",false);
}

function renderCvMessages(animate=false){
  const area=$("#cvMessages");
  if(cvMessages.length===0){
    area.innerHTML=`
      <div class="empty-msgs">
        <i class="ph ph-chat-circle-dots"></i>
        <p>No messages yet</p>
        <small>Say hello! 👋</small>
      </div>`;
    return;
  }

  const [bg,fg]=avatarColor(cvPartnerId);
  const initials=cvPartner?initialsOf(cvPartner.full_name||cvPartner.username):"?";
  const partnerAvatar=cvPartner?.avatar_url
    ?`<img src="${cvPartner.avatar_url}" alt="${initials}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`
    :initials;

  let html="";
  let lastDate=null;
  let lastSenderId=null;

  cvMessages.forEach((msg,i)=>{
    const isOut=msg.sender_id===currentUser.id;
    const isNewDay=!lastDate||!sameDay(lastDate,msg.created_at);
    const isFirstInGroup=msg.sender_id!==lastSenderId;
    const animClass=animate?" animate":"";

    if(isNewDay){
      html+=`<div class="date-chip">${fmtDateChip(msg.created_at)}</div>`;
      lastDate=msg.created_at;
    }

    const showAvatar=!isOut&&isFirstInGroup;

    let bubbleContent="";
    if(msg.type==="image"&&msg.media_url){
      bubbleContent=`
        <div class="bubble-img-wrap">
          <img class="bubble-img" src="${msg.media_url}" alt="Photo"
            onload="this.classList.add('loaded')"
            onclick="cvOpenImg('${msg.media_url}')" />
        </div>
        <span class="bubble-time">${fmtTime(msg.created_at)}</span>`;
    } else {
      bubbleContent=`
        ${escHtml(msg.content||"")}
        <span class="bubble-time">${fmtTime(msg.created_at)}</span>`;
    }

    html+=`
      <div class="bubble-row ${isOut?"out":"in"}${animClass}" data-id="${msg.id}" style="animation-delay:${animate?i*18:0}ms">
        <div class="bubble-mini-avatar${showAvatar?" show":""}" style="background:linear-gradient(135deg,${bg},${fg})">
          ${showAvatar?partnerAvatar:""}
        </div>
        <div class="bubble">
          ${bubbleContent}
        </div>
      </div>`;

    if(isOut&&i===cvMessages.length-1){
      const isRead=msg.is_read;
      html+=`<div class="seen-wrap"><span class="seen-label${isRead?" show":""}" id="cvSeenLabel">Seen</span></div>`;
    }

    lastSenderId=msg.sender_id;
  });

  area.innerHTML=html;
  cvScrollToBottom();
}

function cvScrollToBottom(smooth=false){
  const area=$("#cvMessages");
  area.scrollTo({top:area.scrollHeight,behavior:smooth?"smooth":"instant"});
}

/* ── Send message ── */
async function cvSendMessage(){
  const input=$("#cvInput");
  const text=input.value.trim();
  if(!text) return;

  input.value="";
  input.style.height="auto";
  input.blur();
  toggleCvSend();
  vibrate(25);

  const tempMsg={
    id:"temp-"+Date.now(),
    sender_id:currentUser.id,
    receiver_id:cvPartnerId,
    content:text,type:"text",
    media_url:null,is_read:false,
    created_at:new Date().toISOString(),
  };
  cvMessages.push(tempMsg);
  renderCvMessages(false);

  const rows=$("#cvMessages").querySelectorAll(".bubble-row.out");
  const last=rows[rows.length-1];
  if(last) last.classList.add("animate");
  cvScrollToBottom(true);

  const {data,error}=await sb.from("messages").insert({
    sender_id:currentUser.id,
    receiver_id:cvPartnerId,
    content:text,type:"text",
  }).select().single();

  if(error){cvMessages=cvMessages.filter(m=>m.id!==tempMsg.id);renderCvMessages(false);return;}
  const idx=cvMessages.findIndex(m=>m.id===tempMsg.id);
  if(idx>-1) cvMessages[idx]=data;
}

/* ── Send image ── */
async function cvSendImage(file){
  if(!file) return;
  vibrate(20);

  const ext=file.name.split(".").pop()||"jpg";
  const path=`chat-images/${currentUser.id}/${Date.now()}.${ext}`;
  const localUrl=URL.createObjectURL(file);

  const tempMsg={
    id:"temp-img-"+Date.now(),
    sender_id:currentUser.id,receiver_id:cvPartnerId,
    content:null,type:"image",media_url:localUrl,
    is_read:false,created_at:new Date().toISOString(),
  };
  cvMessages.push(tempMsg);
  renderCvMessages(false);
  cvScrollToBottom(true);

  const rows=$("#cvMessages").querySelectorAll(".bubble-row.out");
  const last=rows[rows.length-1];
  if(last) last.classList.add("animate");

  const {error:upErr}=await sb.storage.from("chat-images").upload(path,file,{cacheControl:"3600",upsert:false});
  if(upErr){cvMessages=cvMessages.filter(m=>m.id!==tempMsg.id);renderCvMessages(false);return;}

  const {data:urlData}=sb.storage.from("chat-images").getPublicUrl(path);
  const {data,error}=await sb.from("messages").insert({
    sender_id:currentUser.id,receiver_id:cvPartnerId,
    content:null,type:"image",media_url:urlData.publicUrl,
  }).select().single();

  if(error){cvMessages=cvMessages.filter(m=>m.id!==tempMsg.id);renderCvMessages(false);return;}
  const idx=cvMessages.findIndex(m=>m.id===tempMsg.id);
  if(idx>-1) cvMessages[idx]=data;
  URL.revokeObjectURL(localUrl);
}

/* ── Input controls ── */
function toggleCvSend(){
  const hasText=$("#cvInput").value.trim().length>0;
  $("#cvSend").classList.toggle("show",hasText);
  $("#cvAttach").classList.toggle("hidden",hasText);
}

function cvAutoGrow(){
  const t=$("#cvInput");
  t.style.height="auto";
  t.style.height=Math.min(t.scrollHeight,130)+"px";
}

$("#cvInput").addEventListener("input",()=>{cvAutoGrow();toggleCvSend();});
$("#cvInput").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();cvSendMessage();}
});
$("#cvSend").addEventListener("click",cvSendMessage);
$("#cvAttach").addEventListener("click",()=>{$("#cvFileInput").click();vibrate(15);});
$("#cvFileInput").addEventListener("change",e=>{
  const file=e.target.files?.[0];
  if(file) cvSendImage(file);
  e.target.value="";
});

function cvNotReady(){ vibrate(20); }

/* ── Full image viewer ── */
function cvOpenImg(url){
  $("#imgOverlayImg").src=url;
  $("#imgOverlay").classList.add("show");
  vibrate(20);
}
$("#imgOverlayClose").addEventListener("click",()=>{
  $("#imgOverlay").classList.remove("show");
  setTimeout(()=>{$("#imgOverlayImg").src="";},300);
});
$("#imgOverlay").addEventListener("click",e=>{
  if(e.target===$("#imgOverlay")) $("#imgOverlayClose").click();
});

/* ========================================================
   MENU SHEET
   ======================================================== */
function openMenu(){$("#menuOverlay").classList.add("show");$("#menuSheet").classList.add("show");}
function closeMenu(){$("#menuOverlay").classList.remove("show");$("#menuSheet").classList.remove("show");}
$("#menuBtn").addEventListener("click",openMenu);
$("#menuOverlay").addEventListener("click",closeMenu);
$("#composeBtn").addEventListener("click",()=>window.location.href="discover.html");

async function markAllRead(){
  await sb.from("messages").update({is_read:true}).eq("receiver_id",currentUser.id).eq("is_read",false);
  conversations.forEach(c=>c.unread=0);
  renderList();closeMenu();vibrate(30);
}
$("#markAllReadBtn").addEventListener("click",markAllRead);
$("#signOutBtn").addEventListener("click",async()=>{
  await sb.auth.signOut();
  window.location.href="index.html";
});

/* ========================================================
   SEARCH
   ======================================================== */
$("#searchInput").addEventListener("input",e=>{
  searchQ=e.target.value.trim();
  $("#searchWrap").classList.toggle("has-text",!!searchQ);
  renderList();
});
$("#searchClear").addEventListener("click",()=>{
  $("#searchInput").value="";searchQ="";
  $("#searchWrap").classList.remove("has-text");
  renderList();
  $("#searchInput").focus();
});

/* ========================================================
   THEME
   ======================================================== */
(function(){
  const btn=$("#themeToggle");
  const icon=$("#themeIcon");
  const html=document.documentElement;
  function applyTheme(dark){
    if(dark){html.setAttribute("data-theme","dark");icon.className="ph ph-sun";}
    else{html.removeAttribute("data-theme");icon.className="ph ph-moon";}
  }
  applyTheme(localStorage.getItem("nova-theme")==="dark");
  btn.addEventListener("click",()=>{
    const isDark=html.getAttribute("data-theme")==="dark";
    applyTheme(!isDark);
    localStorage.setItem("nova-theme",!isDark?"dark":"light");
    btn.classList.remove("shaking");void btn.offsetWidth;btn.classList.add("shaking");
    setTimeout(()=>btn.classList.remove("shaking"),400);
  });
})();

/* ========================================================
   OFFLINE
   ======================================================== */
const updateOffline=()=>$("#offline").classList.toggle("show",!navigator.onLine);
window.addEventListener("online",updateOffline);
window.addEventListener("offline",updateOffline);
updateOffline();

/* ========================================================
   BACK GESTURE — swipe right to close chat view
   ======================================================== */
let swipeStartX=0;
document.getElementById("chatView").addEventListener("touchstart",e=>{
  swipeStartX=e.touches[0].clientX;
},{passive:true});
document.getElementById("chatView").addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-swipeStartX;
  if(dx>80) closeChat();
},{passive:true});

/* ========================================================
   AUTH & INIT
   ======================================================== */
(async function init(){
  const {data}=await sb.auth.getSession();
  if(!data.session){window.location.href="index.html";return;}
  currentUser=data.session.user;

  await Promise.all([loadMyProfile(),loadConversations()]);

  $("#loader").classList.add("hide");
  setTimeout(()=>{const l=$("#loader");if(l) l.remove();},400);

  // Realtime: new messages → refresh list
  sb.channel("chats-realtime")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>{
      const msg=payload.new;
      if(msg.sender_id===currentUser.id||msg.receiver_id===currentUser.id){
        loadConversations();
      }
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"},()=>{
      loadConversations();
    })
    .subscribe();

  // Realtime: online status in list
  sb.channel("chats-profiles-online")
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"profiles"},payload=>{
      const updated=payload.new;
      const conv=conversations.find(c=>c.partner.id===updated.id);
      if(conv){conv.partner.is_online=updated.is_online;renderList();}
    })
    .subscribe();
})();
</script>
